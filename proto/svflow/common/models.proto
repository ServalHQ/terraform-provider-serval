}

message ManualProvisioningAssignee {
    string assignee_id = 1;
    ManualProvisioningAssigneeType assignee_type = 2;
}

message Entitlement {
    reserved 8, 11, 13, 14;

    string id = 1;
    string name = 2;
    string description = 3;
    string business_justification = 4;
    bool is_enabled = 5;
    AccessPolicy access_policy = 6;
    string provisioning_method = 7;
    repeated string linked_entitlement_ids = 9;
    Resource resource = 10;
    bool is_access_policy_overridden = 12;
    WorkflowMeta custom_provisioning_workflow = 15;
    WorkflowMeta custom_deprovisioning_workflow = 16;
    bool is_ingested = 17; // Indicates if entitlement was created via ingestion config
    bool is_app_access_default_role = 18; // Indicates if entitlement is a default role for app access
    string app_instance_id = 19;
    string access_policy_id = 20;
    optional string provisioning_workflow_params = 21; // JSON string of provisioning workflow parameters schema
    repeated ManualProvisioningAssignee manual_provisioning_assignees = 22;
    bool require_form_confirmation = 23;
    string scoped_id = 24;
    bool is_deleted = 25; // own-row deleted_at only — resource/app deletedness ride Resource.is_deleted/AppInstance.is_deleted
    // Serval (svauth) groups linked for the linked-entitlement provisioning
    // method: provisioning adds the for-user to each group, deprovisioning
    // removes them. Sibling of linked_entitlement_ids.
    repeated string linked_serval_group_ids = 26;
    // Manual provisioning with nobody named: the provisioning task is created
    // unassigned and routed by the team's ticket assignment rules. Mutually
    // exclusive with manual_provisioning_assignees.
    bool manual_provisioning_route_to_team_queue = 27;
    // True: users in every linked group hold this role and are seated on its
    // roster. False: the links only drive provisioning (a bundle role).
    bool infer_membership_from_links = 28;
}

message AccessPolicy {
    string id = 1;
    string team_id = 10;
    string name = 2;
    string description = 3;
    ApprovalProcedure approval_procedure = 4;
    int32 max_access_minutes = 5;
    bool require_business_justification = 6;
    OnBehalfOfConfirmationProcedure on_behalf_of_confirmation_procedure = 7;
    bool is_team_default = 8;
    optional int32 recommended_access_minutes = 9;
    // Whether access requests for roles under this policy are collected via a
    // form rather than a chat conversation. New home for the setting that is
    // being migrated off the per-role entitlement / team-default fields.
    bool require_form_confirmation = 11;
}

message TeamsFormSettings {
  string configuration_hash = 1;
  string tenant_id = 2;
  string client_id = 3;
  string form_host = 4;
  bool uses_custom_app = 5;
  string team_id = 6;
  bool dialogs_available = 8;
  string home_page_url = 9;
  string organization_home_page_url = 10;
  string organization_bot_home_page_url = 11;
  // Host/cloud readiness only; feedback producers evaluate their ticket team rollout independently.
  bool feedback_dialog_available = 12;
}

message AppInstance {
    string id = 1;
    string team_id = 2;
    Service service = 3;
    string display_name = 4;
    string instance_name = 5;
    string instance_id = 6;
    repeated Integration integrations = 7;
    reserved 8; // was app_owner_user_ids
    string default_access_policy_id = 9;
    bool default_new_resources_requests_enabled = 10;
    bool resource_sync_enabled = 11;
    bool access_requests_enabled = 12;
    optional KnowledgeSource knowledge_source = 13;
    bool is_deleted = 14;
    bool user_sync_enabled = 15;
    bool app_sync_enabled = 16;
    repeated AccessRelationship access_relationships = 17;
    bool exclusive_app_access_enabled = 18;
    reserved 19, 20;
    SharedFromTeam shared_from_team = 21;
    // Set when this app instance cannot be duplicated to another team.
    // Absence means duplication is allowed.
    optional DuplicationRestriction duplication_restriction = 22;
    // IDs of the app-instance-scoped tags currently attached.
    repeated string tag_ids = 23;
    // When true, integration requests for this connection are routed directly
    // from a self-hosted worker instead of the central svflow proxy. Only
    // honored for self-hosted workers.
    bool route_direct_from_worker = 24;
    // Tri-state form of the "restrict to one role per user" setting. OFF mirrors
    // exclusive_app_access_enabled=false; BLOCK / AUTO_REMOVE both imply enabled
    // and choose how a request for a second role is handled.
    // exclusive_app_access_enabled is retained as the backwards-compatible gate
    // for older clients/workers.
    ExclusiveAppAccessMode exclusive_app_access_mode = 25;
    // Aggregated sync + health-check health, derived on read from the sync
    // result and health-check run history. Unset on responses from backends
    // (or endpoints) that don't hydrate it.
    IntegrationHealth integration_health = 26;
    // User setting gating integration-health error surfacing (icons) and
    // scheduled health-check execution. When false, integration_health is
    // left unset on reads and the health-check cron skips this instance;
    // manual runs from the health-check panel still work.
    bool scheduled_health_check_runs_enabled = 27;
    // For A2A-connected custom apps: the agent card captured by the last
    // discovery sync. Only populated on surfaces that opt in (currently the
    // public ListAppInstances).
    A2AAgentCard a2a_agent_card = 28;
    // Whether this connection's resource (group) sync may create Serval users
    // for members it does not recognize. Grouped rather than flat because the
    // two fields are only meaningful together — see the message doc.
    ResourceUserCreationPolicy resource_user_creation_policy = 29;
    bool last_login_sync_enabled = 30;
    // When true this connection is out of auto-pick: it is reachable only from
    // the packages that link it.
    bool is_restricted = 31;
    // Jira Data Center only: the URL people open Jira at in a browser when it
    // differs from the API host in instance_id. Empty means use instance_id.
    string browse_url = 32;
    // User-owned presentation metadata. Empty on legacy and first-connect rows;
    // display_name retains its existing computed fallback in that case.
    string connection_name = 33;
    string connection_description = 34;
    InheritedOIDCConnection inherited_oidc_connection = 35;
    // Teams this instance is actively shared INTO (outbound; revoked shares
    // excluded) — the inverse of shared_from_team. IDs only: svflow has no
    // team names, callers resolve them via svauth's team list. Hydrated only
    // by endpoints that opt in (currently SearchAppInstancesForOrg).
    repeated string shared_with_team_ids = 36;
    // Whether this instance is connected per the REGISTERED × CONNECTED model
    // documented on AggregateConnectorUsage (db/queries/appmgmt.sql): a
    // service-account credential exists, or the mechanism is credential-less
    // (delegated OIDC / MCP / A2A). Credentialed ≠ working — no health claim.
    // Unset on responses from endpoints that don't hydrate it.
    optional bool connected = 37;
    // Branch teams whose copy of this connection borrows its credential (a
    // branch overlay). Listed here instead of in shared_with_team_ids so an
    // org-wide inventory shows each connection once. Hydrated only by
    // endpoints that opt in (currently SearchAppInstancesForOrg).
    repeated string branch_team_ids = 38;
    // When the connection last changed state as far as its synced groups are
    // concerned: deleted_at once deleted, else the resource-sync config's
    // updated_at, else created_at. Opaque and monotonic; only ever compared
    // against other values of this field. svauth fences a stale connection's
    // groups at the generation it observed, and group writes carry it on
    // SetGroupMembersFromExternalSourceRequest.source_generation.
    google.protobuf.Timestamp group_sync_generation = 39;
    // Slack app this connection speaks as; empty when unknown, which matches
    // no Slack event or click.
    string slack_app_id = 40;
    // Microsoft Teams only: the Personal Agent answers this bot's 1:1 chats
    // instead of the help desk, where the workspace holding the connection
    // has the Personal Agent in Teams.
    bool personal_agent_chats = 41;
}

// The source of a branch's sign-in configuration. No credentials are copied.
message InheritedOIDCConnection {
    string app_instance_id = 1;
    string team_id = 2;
}

// The per-install "may resource sync mint net-new Serval users?" policy.
// Two fields because "off" has two causes the UI must not render alike:
// the customer chose it, or the integration forbids it outright.
message ResourceUserCreationPolicy {
    // The customer's stored choice (an opt-in: FALSE when never set);
    // meaningless when forced_off_by_integration is true.
    bool allow_create_new_users = 1;
    // True when no resource config on this integration permits user creation
    // (github/jira/buildkite -- unreliable member emails). A ceiling the
    // customer cannot raise: render the control disabled, with the reason.
    bool forced_off_by_integration = 2;
}

// Aggregated health of an app instance's syncs and integration health checks.
message IntegrationHealth {
    IntegrationHealthStatus status = 1;
    // Superseded by failing_syncs + failing_health_checks, which let the UI
    // link sync failures and health-check failures to their own surfaces.
    // Still populated with the combined list so frontend bundles from before
    // the split keep working during deploy windows; new code should only read
    // it as that fallback. Deliberately not marked with the deprecated field
    // option: the generated deprecation JSDoc tag would force a lint
    // suppression at the one legitimate fallback read site.
    repeated string failing_checks = 2;
    // Human-readable names of the syncs currently failing (e.g. "User sync").
    // Empty unless status is UNHEALTHY.
    repeated string failing_syncs = 3;
    // Names of the health-check workflows currently failing. Empty unless
    // status is UNHEALTHY.
    repeated string failing_health_checks = 4;
}

enum IntegrationHealthStatus {
    INTEGRATION_HEALTH_STATUS_UNSPECIFIED = 0;
    // No finished sync or health-check run exists yet for the instance.
    INTEGRATION_HEALTH_STATUS_UNKNOWN = 1;
    INTEGRATION_HEALTH_STATUS_HEALTHY = 2;
    INTEGRATION_HEALTH_STATUS_UNHEALTHY = 3;
}

// How an app that restricts users to one role at a time handles a request for a
// second role.
enum ExclusiveAppAccessMode {
    EXCLUSIVE_APP_ACCESS_MODE_UNSPECIFIED = 0;
    // No restriction: users may hold multiple roles.
    EXCLUSIVE_APP_ACCESS_MODE_OFF = 1;
    // Reject the new request while the user holds (or is requesting) a role.
    EXCLUSIVE_APP_ACCESS_MODE_BLOCK = 2;
    // Grant the new role and deprovision the user's prior role(s), including
    // removal from any linked groups.
    EXCLUSIVE_APP_ACCESS_MODE_AUTO_REMOVE = 3;
}

enum DuplicationBlockedReason {
    DUPLICATION_BLOCKED_REASON_UNSPECIFIED = 0;
    // The integration uses a rotating OAuth refresh token. Copying such
    // credentials across teams causes one holder to silently invalidate the
    // other on the next refresh. Users should use App Sharing instead.
    DUPLICATION_BLOCKED_REASON_OAUTH_REFRESH_TOKEN = 1;
}

message DuplicationRestriction {
    DuplicationBlockedReason reason = 1;
}

message SharedFromTeam {
    string team_id = 1;
    // Display name of the owning (source) team. Populated by the API layer
    // via svauth when serving list/get endpoints so recipient-team viewers who
    // aren't members of the source team still see "Shared from <team>" in the UI.
    string team_name = 2;
}

// DEPRECATED: superseded by AccessRelationshipType. Retained so the deprecated
// /v2/app-relationships endpoints keep their original JSON enum names. Values
// mirror AccessRelationshipType 1:1, so the shim handlers convert by numeric cast.
enum AppRelationshipType {
    option deprecated = true;
    APP_RELATIONSHIP_TYPE_UNSPECIFIED = 0;
    APP_RELATIONSHIP_TYPE_OWNER = 1;
}

// DEPRECATED: superseded by AccessRelationshipTargetType (see AppRelationshipType).
enum AppRelationshipTargetType {
    option deprecated = true;
    APP_RELATIONSHIP_TARGET_TYPE_UNSPECIFIED = 0;
    APP_RELATIONSHIP_TARGET_TYPE_USER = 1;
    APP_RELATIONSHIP_TARGET_TYPE_GROUP = 2;
}

enum AccessRelationshipType {
    ACCESS_RELATIONSHIP_TYPE_UNSPECIFIED = 0;
    ACCESS_RELATIONSHIP_TYPE_OWNER = 1;
}

enum AccessRelationshipTargetType {
    ACCESS_RELATIONSHIP_TARGET_TYPE_UNSPECIFIED = 0;
    ACCESS_RELATIONSHIP_TARGET_TYPE_USER = 1;
    ACCESS_RELATIONSHIP_TARGET_TYPE_GROUP = 2;
}

// The kind of entity a relationship is on. Generalizes the former
// app_relationships model (app_instance subjects only) so resources, roles
// (entitlements), and teams can have owners too.
enum AccessRelationshipSubjectType {
    ACCESS_RELATIONSHIP_SUBJECT_TYPE_UNSPECIFIED = 0;
    ACCESS_RELATIONSHIP_SUBJECT_TYPE_APP_INSTANCE = 1;
    ACCESS_RELATIONSHIP_SUBJECT_TYPE_RESOURCE = 2;
    ACCESS_RELATIONSHIP_SUBJECT_TYPE_ENTITLEMENT = 3;
    ACCESS_RELATIONSHIP_SUBJECT_TYPE_TEAM = 4;
    // A native knowledge node: a knowledge base, a folder, or an article. All
    // three are rows in knowledge_items (the model unification dropped the
    // separate knowledge_bases / knowledge_documents tables), so one subject
    // type carries owners for a whole knowledge base and for a single article.
    ACCESS_RELATIONSHIP_SUBJECT_TYPE_KNOWLEDGE_ITEM = 5;
}

message AccessRelationship {
    string id = 1;
    AccessRelationshipType relationship_type = 2;
    string target_id = 3;
    AccessRelationshipTargetType target_type = 4;
    google.protobuf.Timestamp created_at = 5;
    // Polymorphic subject: subject_id holds the app_instance_id | resource_id |
    // entitlement_id | team_id, disambiguated by subject_type.
    AccessRelationshipSubjectType subject_type = 6;
    string subject_id = 7;
}


message ApprovalProcedure {
    string id = 1;
    repeated ApprovalStep steps = 2;
    // How long each step waits for a human decision before timing out
    // (in seconds). Server clamps to [5 minutes, 90 days]; zero on a
    // SetApprovalProcedureRequest means "keep the existing value if any,
    // otherwise apply the 30-day default". The field is always populated
    // on responses.
    int32 timeout_seconds = 3;
    // Set only for a named procedure from the workspace's approval procedure library.
    optional NamedApprovalProcedure named = 4;
}

message NamedApprovalProcedure {
    string scoped_id = 1;
    // Name of the procedure's current version.
    string name = 2;
}

enum ManagerApprovalType {
    MANAGER_APPROVAL_TYPE_UNSPECIFIED = 0;
    ALLOW_AS_PRIMARY = 1;
    ALLOW_AS_SECONDARY = 2;
}

// OwnerApprovalType configures an owner approver source on an approval step.
// Shared by all four owner sources (app / team / resource / role), each
// resolved at its own level of the access request's hierarchy (entitlement ->
// resource -> app instance -> team). Only valid for access policy approval
// procedures.
enum OwnerApprovalType {
    OWNER_APPROVAL_TYPE_UNSPECIFIED = 0;
    OWNER_ALLOW_AS_PRIMARY = 1;
    OWNER_ALLOW_AS_SECONDARY = 2;
}

message ApprovalGroupRequirement {
    string group_id = 1;
    int32 min_approvals = 2;
}

message ApprovalChannelRequirement {
    string slack_channel_id = 1;
    int32 min_approvals = 2;
}

message ApprovalStep {
    string id = 1;
    reserved 2;

    bool allow_self_approval = 5;

    // Specific users
    repeated string specific_user_ids = 3;
    repeated string secondary_specific_user_ids = 6;

    // Serval groups
    repeated string serval_group_ids = 4;
    repeated string secondary_serval_group_ids = 7;

    // Manager approval
    ManagerApprovalType manager_approval = 8;

    // If step_type is CUSTOM_WORKFLOW, this is the workflow ID to execute
    string custom_workflow_id = 9;

    // App owner approval (owners of the requested role's app instance).
    OwnerApprovalType app_owner_approval = 10;

    // Controls whether approvers are asked for a justification when deciding this step.
    // Valid values: "not_requested", "optional", "required".
    string approver_justification_mode = 11;

    // Owner approver sources at the other access-hierarchy levels (see
    // OwnerApprovalType).
    OwnerApprovalType team_owner_approval = 12;
    OwnerApprovalType resource_owner_approval = 13;
    OwnerApprovalType role_owner_approval = 14;
    optional int32 stage_number = 15;
    repeated ApprovalGroupRequirement group_requirements = 16;
    bool suppress_notifications = 17;
    // Whether an approver whose approval would otherwise be assumed (they are
    // the request's target, or its ticket's creator) has it resolved for them
    // on render. Optional so a client that omits it leaves the stored value
    // alone instead of resetting it to the proto3 bool default.
    optional bool auto_approve_self = 18;
    repeated ApprovalChannelRequirement channel_requirements = 19;
}

message OnBehalfOfConfirmationProcedure {
    string id = 1;
    bool bypass_for_team_members = 2;
}

// Approval Delegation

enum ApprovalDelegateType {
    APPROVAL_DELEGATE_TYPE_UNSPECIFIED = 0;
    APPROVAL_DELEGATE_TYPE_USER = 1;
    APPROVAL_DELEGATE_TYPE_GROUP = 2;
}

message ApprovalDelegate {
    // The type of delegate (user or group).
    ApprovalDelegateType type = 1;
    // The ID of the delegate (user ID or group ID, depending on type).
    string id = 2;
}

message ApprovalDelegation {
    // 6 and 7 carried the pre-restructure single-delegate columns and must
    // not be reused by old readers' ghosts.
    reserved 6, 7;

    string id = 1;
    google.protobuf.Timestamp created_at = 2;

    string delegator_user_id = 3;
    string organization_id = 4;

    // The delegates who can approve on behalf of the delegator.
    repeated ApprovalDelegate delegates = 5;

    int32 priority = 8;
    string description = 9;

    // Active window, half-open [active_from, active_until). An absent edge is
    // unbounded on that side; both absent = permanent rule. Consulted only
    // when routing new approvals/ticket assignments — expiry never re-routes
    // in-flight work.
    optional google.protobuf.Timestamp active_from = 10;
    optional google.protobuf.Timestamp active_until = 11;
}

message Integration {
    string id = 1;
    oneof integration_auth {
        RedactedApiKeyIntegration api_key = 3;
        RedactedClientCredentialsIntegration client_credentials = 4;
        RedactedOAuthTokenIntegration oauth_token = 5;
        RedactedCustomDataIntegration custom_data = 6;
    }
    string api_domain = 7;
    // When the integration was created
    google.protobuf.Timestamp created_at = 8;
    // When the integration was last updated (e.g., reconnected)
    google.protobuf.Timestamp last_updated_at = 9;
    // User who created this integration (if known)
    string created_by_user_id = 10;
    // User who last updated this integration (if known)
    string updated_by_user_id = 11;
    bool is_shared = 12;
    SlackInstallationIdentity slack_installation = 13;
}

message SlackInstallationIdentity {
    string app_id = 1;
    oneof scope {
        string workspace_id = 2;
        string enterprise_id = 3;
    }
}

message RedactedApiKeyIntegration {
    string api_key_id = 1;
    int32 api_key_length = 2;
    string api_key_last_four = 3;
    // Hint for the frontend to render the correct auth-type card (Basic vs
    // Bearer) when this integration falls back to the legacy single-key path
    // and there are no `custom_integration_auth_headers` rows to read the
    // user's chosen scheme from. Populated by the backend by peeking at the
    // decrypted plaintext prefix (`Basic ` / `Bearer `). Empty string means
    // no scheme prefix detected — the frontend should fall back to its
    // header-name heuristic.
    string auth_scheme = 4;
}

message RedactedClientCredentialsIntegration {
    string client_id = 1;
    repeated string scopes = 2;
    int32 client_secret_length = 3;
    string client_secret_last_four = 4;
    // True when client_id is a customer-provided app registration rather than
    // the platform's own app. Computed for microsoft-teams only today; false
    // for every other service.
    bool uses_custom_app = 5;
}

message RedactedOAuthTokenIntegration {
    string client_id = 1;
    repeated string scopes = 2;
}

message RedactedCustomDataIntegration {
    string data_format = 1;
    string data = 2;
}

// Error information returned when an external API call fails during 
// ticket source configuration loading. This allows the UI to show 
// helpful error messages instead of crashing the entire page.
message TicketSourceError {
    // A user-friendly message explaining what went wrong
    string message = 1;
    // The section/field that failed to load (e.g., "team_options", "status_options")
    string section = 2;
    // Whether this error is likely due to a permission/configuration issue
    // that the user needs to fix in their external system
    bool is_permission_error = 3;
}

message TicketSource {
    string id = 1;
    TicketSourceType type = 2;
    string team_id = 3;
    string app_instance_id = 4;
    string service_instance_id = 5;
    string service_instance_name = 6;
    string api_domain = 23;
    
    // Legacy field - will be deprecated after migration
    TicketSyncStrategyType sync_strategy = 7;
    
    // New separate sync strategy fields
    optional TicketSyncOutStrategy sync_out_strategy = 18;
    optional TicketSyncInStrategy sync_in_strategy = 19;
    
    google.protobuf.Timestamp last_synced_at = 8;
    // The source's primary external container, and the one Serval CREATES in.
    string external_team_id = 9;

    // Extra containers this source ingests from. ADDITIVE, not the full list:
    // the effective set is the union with external_team_id, so empty means
    // "just external_team_id".
    repeated string additional_external_team_ids = 47;
    repeated TicketSourceTeamOption team_options = 10;
    repeated TicketSourceStatusMapping status_mappings = 11;
    repeated TicketSourcePriorityMapping priority_mappings = 21;
    repeated TicketSourceStatusOption status_options = 12;
    repeated TicketSourcePriorityOption priority_options = 22;

    // Jira-specific field
    bool is_jira_connect_installed = 13;
    // True when this Jira connection's base credential is a customer-provided
    // (bring-your-own) OAuth app rather than standard Serval OAuth. The setup
    // wizard soft-gates the Forge app for BYO (warn but still allow setup),
    // while standard OAuth stays hard-gated on Forge. Numbered 44 (next free) to
    // preserve existing wire numbers.
    bool is_jira_custom_oauth = 44;
    // True when this Jira connection is a self-hosted Data Center instance
    // rather than Cloud. Consumers must not infer the deployment from the shape
    // of service_instance_id: a single-label Data Center host is
    // indistinguishable from a Cloud Connect site subdomain.
    bool is_jira_data_center = 46;
    // Jira Data Center only: normalized origin (plus optional context path)
    // for user-facing ticket links. Empty means build links from
    // service_instance_id, which is the API host and may be a private endpoint.
    string browse_url = 53;
    optional string jira_connect_app_url = 14;
    repeated TicketSourceRequestTypeOption request_type_options = 15;
    // Jira project metadata determines whether this is a JSM request type or PM issue type.
    string request_type_id = 16;
    repeated TicketSourceAdditionalField additional_fields = 17;
    
    // Controls whether this ticket source is enabled for syncing
    bool enabled = 20;
    
    // Errors encountered when loading data from external APIs.
    // When populated, the corresponding options/fields may be empty or stale,
    // but the user can still interact with other sections of the form.
    repeated TicketSourceError errors = 24;

    // Freshservice and Zendesk: only import tickets assigned to this agent
    // group. Empty means every group.
    string external_group_id = 25;
    repeated TicketSourceGroupOption group_options = 26;
    
    // When true, ticket updates come via webhooks. Polling is disabled for this source.
    bool webhook_enabled = 27;

    // Freshservice-specific: webhook secret for validating incoming webhooks.
    // Only populated for Freshservice ticket sources. If none exists, one is
    // auto-generated on first GetTicketSource call.
    string webhook_secret = 28;

    // When true, Serval will automatically respond to new tickets ingressed from this source.
    bool ai_response_on_ingress = 29;

    // Controls whether comments/messages are synced bidirectionally for this source.
    bool sync_comments_enabled = 30;
    // Master gate for ticket field changes. When false, no attributes sync.
    // When true, attribute_sync (unset = every field enabled) selects which.
    bool sync_attributes_enabled = 31;
    // Unset means every attribute is enabled — older clients that omit this
    // field, and Temporal replays of ChannelConfig from before it existed,
    // must keep observing that default. Only read when the master is true.
    optional TicketAttributeSyncSettings attribute_sync = 48;

    // ServiceNow-specific: controls which ticket types are synced.
    // All default to true for backward compatibility.
    bool sync_incidents_enabled = 32;
    bool sync_request_items_enabled = 33;
    bool sync_hr_cases_enabled = 34;

    // When true, this ticket source is opted into the live-agent chat
    // handoff surface (UI affordances on the ticket view and Slack mirror).
    // Only meaningful for channels whose svhelp implementation satisfies
    // the LiveAgentCapableChannel capability (today: ServiceNow). Off by
    // default so existing sources don't suddenly show live-agent UI.
    bool live_agent_enabled = 35;

    // Hides idle Start chat prompts; workflow starts and active-session controls remain available.
    bool live_agent_start_button_hidden = 54;

    // Optional team workflow overrides for live-agent operations. Empty
    // when unset — svhelp resolves the installed default installable by slug.
    optional string live_agent_check_availability_workflow_id = 36;
    optional string live_agent_start_session_workflow_id = 37;
    optional string live_agent_end_session_workflow_id = 38;

    // Computed from the selected Jira project when loading its settings.
    // Unspecified when no Jira project is selected or classification fails.
    JiraProjectMode jira_project_mode = 39;

    // Historical backfill floor. When set, the initial historical ticket
    // import only pulls tickets updated on or after this timestamp (e.g. "the
    // last 90 days"). Unset means backfill from the earliest ticket (all
    // history). Only consulted at bootstrap, while last_synced_at is NULL;
    // once a source has synced, changing it has no effect.
    optional google.protobuf.Timestamp historical_sync_after = 40;

    // ServiceNow-specific: optional per-ticket-type ServiceNow encoded queries
    // appended to that type's ingress query so customers can exclude unwanted
    // tickets (e.g. monitoring / system-generated noise). Each filter is
    // applied ONLY to its own table, so an incident-specific field (e.g.
    // category) never reaches request items or HR cases. Empty means no extra
    // filtering for that type. Configured alongside the historical sync
    // strategy in the UI.
    string incident_ingress_filter = 41;
    string request_item_ingress_filter = 42;
    string hr_case_ingress_filter = 43;

    // When true, AI-owned ("assigned to Serval") tickets egressed to the
    // external system are NOT auto-assigned to the Serval app account — they
    // follow the external project's default assignment instead (typically
    // Unassigned). Default false preserves the historical behavior of mirroring
    // "Serval owns this" onto the external ticket. Honored by Jira egress today.
    bool leave_ai_tickets_unassigned = 45;

    // Requester-facing name used for live-agent messages. Empty uses the
    // human agent's first name.
    string live_agent_display_name = 49;

    // Optional deployed workflow that selects the Jira destination for initial
    // issue creation. Empty means the configured default is always used.
    optional string jira_ticket_routing_workflow_id = 50;
    reserved 51, 52;
    reserved "jira_issue_type_id", "jira_issue_type_options";
}

// Serializers must always populate this from the DB. Proto3 bool zeros read
// as false, so an empty message would disable every field.
message TicketAttributeSyncSettings {
    bool status_enabled = 1;
    bool priority_enabled = 2;
    bool assignment_enabled = 3;
    bool name_enabled = 4;
    bool description_enabled = 5;
}

enum JiraProjectMode {
    JIRA_PROJECT_MODE_UNSPECIFIED = 0;
    JIRA_PROJECT_MODE_JSM = 1;
    JIRA_PROJECT_MODE_PROJECT_MANAGEMENT = 2;
}

enum TicketSourceType {
    TICKET_SOURCE_TYPE_UNSPECIFIED = 0;
    LINEAR = 1;
    JIRA = 2;
    FRESHSERVICE = 3;
    SLACK = 4;
    ZENDESK = 5;
    SERVICENOW = 6;
    MICROSOFT = 7;
    SALESFORCE = 8;
    GOOGLE_CHAT = 9;
}

enum TicketSyncStrategyType {
    TICKET_SYNC_STRATEGY_TYPE_UNSPECIFIED = 0;
    
    // Legacy types - will be deprecated after migration
    SELECTIVE_DEPRECATED = 1;
    INGEST_DEPRECATED = 2;
    FULL_TWO_WAY_DEPRECATED = 3;
    SYNC_ON_ESCALATION_DEPRECATED = 4;
}

enum TicketSyncOutStrategy {
    TICKET_SYNC_OUT_STRATEGY_UNSPECIFIED = 0;
    AUTOMATIC = 1;       // Send new tickets immediately
    ON_ESCALATION = 2;   // Send new tickets on escalation
    SELECTIVE = 3;       // Send specific tickets manually
    ON_ESCALATION_CONDENSED = 4;  // Send new tickets on escalation, skip historical messages
    SELECTIVE_CONDENSED = 5;      // Like SELECTIVE but only sync messages after escalation
}

enum TicketSyncInStrategy {
    TICKET_SYNC_IN_STRATEGY_UNSPECIFIED = 0;
    NEW_ONLY = 1;         // Import new tickets only  
    HISTORICAL_AND_NEW = 2;             // Import existing + new tickets
}

message TicketSourceRequestTypeOption {
    string id = 1;
    string name = 2;
}

enum TicketStatusMappingDirection {
    // INGRESS is the zero value on purpose: a mapping with the field unset — an
    // old client that predates it, or old serialized ChannelConfig in Temporal
    // egress history — reads as an external->Serval (ingress) mapping, preserving
    // current behavior for replay/back-compat.
    TICKET_STATUS_MAPPING_DIRECTION_INGRESS = 0;  // external -> Serval
    TICKET_STATUS_MAPPING_DIRECTION_EGRESS = 1;   // Serval -> external
}

message TicketSourceStatusMapping {
    string status_option_id = 1;
    string external_status_id = 2;
    string external_team_id = 3;
    // Optional: Specifies which external ticket subtype this mapping applies to.
    // For ServiceNow, this can be "incident", "requested_item", or "hr_case".
    // If empty, the mapping applies to the default type (e.g., "incident" for ServiceNow).
    string external_ticket_subtype = 4;
    // Jira only: the individual external status id within the category in
    // external_status_id. Empty means this is a category-level (bucket) mapping;
    // a non-empty value is a precise substatus mapping that takes precedence over
    // the category mapping on ingress/egress.
    string external_substatus_id = 5;
    // Sync direction this row configures; defaults to INGRESS (the zero value) so
    // existing rows and old Temporal history keep their current behavior. Egress
    // resolution prefers EGRESS rows for a Serval status and falls back to
    // reverse-looking-up INGRESS rows when it has none.
    TicketStatusMappingDirection direction = 6;
}

message TicketSourcePriorityMapping {
    string priority_option_id = 1;
    string external_priority_id = 2;
    string external_team_id = 3;
}

message TicketSourceTeamOption {
    string id = 1;
    string name = 2;
