syntax = "proto3";

package svflow.common.models;

import "google/protobuf/timestamp.proto";
/*
** These are common models used by svflow and other services (i.e. svhelp)
** We currently share using symlinks.
*/
import "serval/resources/v1/agentchannels/channels.proto";
import "svauth/shared_models/models.proto";

option go_package = "serval.com/svflow/internal/gen/proto/svflow/common";

// Whether a credits read could be answered. Same meaning as svauth's
// UsageBillingAvailability: NOT_CONFIGURED is a deployment or organization
// with nothing to charge against (no Paid credential, or no credit order), and
// UNAVAILABLE is a read that failed.
enum CreditsAvailability {
    CREDITS_AVAILABILITY_UNSPECIFIED = 0;
    CREDITS_AVAILABILITY_READY = 1;
    CREDITS_AVAILABILITY_NOT_CONFIGURED = 2;
    CREDITS_AVAILABILITY_UNAVAILABLE = 3;
    // The caller may see the resource but not what it cost. No amounts are
    // returned.
    CREDITS_AVAILABILITY_HIDDEN = 4;
    // More runs than one read covers. Unlike UNAVAILABLE, retrying will not
    // help, so clients should not poll.
    CREDITS_AVAILABILITY_TOO_LARGE = 5;
}

message AdvertisedCrossTeamWorkflowTarget {
    string team_id = 1;
    string team_name = 2;
    repeated AdvertisedCrossTeamWorkflowAppInstance app_instances = 3;
}

message AdvertisedCrossTeamWorkflowAppInstance {
    string app_instance_id = 1;
    string service = 2;
    string service_instance_name = 3;
    string custom_service_id = 4;
    string custom_service_name = 5;
}

message ApprovalConsumer {
    string type = 1;
    string id = 2;
}

enum ExecutionScope {
    EXECUTION_SCOPE_UNSPECIFIED = 0;
    TEAM_PRIVATE = 1;
    TEAM_PUBLIC = 2;
}

enum ActionableItemType {
    ACTIONABLE_ITEM_TYPE_UNSPECIFIED = 0;
    TASK = 1;
    ACCESS_REQUEST_APPROVAL = 2;
    WORKFLOW_RUN_APPROVAL = 3;
    ACCESS_REQUEST_ON_BEHALF_OF_CONFIRMATION = 4;
    WORKFLOW_RUN_ON_BEHALF_OF_CONFIRMATION = 5;
}

message ActionableItem {
    string ticket_id = 1;
    ActionableItemType type = 2;
    bool action_completed = 3;
}

enum TaskType {
    TASK_TYPE_UNSPECIFIED = 0;
    PROVISIONING = 1;
    DEPROVISIONING = 2;
}

enum TaskResponse {
    TASK_RESPONSE_UNSPECIFIED = 0;
    TASK_RESPONSE_COMPLETED = 1;
    TASK_RESPONSE_DISMISSED = 2;
}

message Task {
    string id = 1;
    string ticket_id = 2;
    string workflow_run_id = 3;
    google.protobuf.Timestamp created_at = 4;
    reserved 5; // completed_at removed in favor of explicit response fields
    reserved 6; // is_completed removed in favor of explicit response fields
    string assigned_to_user_id = 7;
    string name = 8;
    string description = 9;
    TaskType task_type = 10;
    optional string response_by_user_id = 11;
    optional google.protobuf.Timestamp response_at = 12;
    TaskResponse response = 13;
}

enum ApprovalRequestResult {
    APPROVAL_REQUEST_RESULT_UNSPECIFIED = 0;
    PENDING = 1;
    APPROVED = 2;
    DENIED = 3;
    TIMEDOUT = 4;
    CANCELED = 5;  // User-initiated cancellation (e.g., cancel pending extension)
}

// Display status for extension/allocation cards in the UI.
// Backend computes this to eliminate complex frontend state determination.
enum ExtensionDisplayStatus {
    EXTENSION_DISPLAY_STATUS_UNSPECIFIED = 0;
    EXTENSION_DISPLAY_STATUS_PROCESSING = 1;      // Allocation being created, workflow starting
    EXTENSION_DISPLAY_STATUS_PENDING_APPROVAL = 2; // Waiting for approval
    EXTENSION_DISPLAY_STATUS_APPROVED = 3;         // Approved and active
    EXTENSION_DISPLAY_STATUS_DENIED = 4;           // Rejected by approver
    EXTENSION_DISPLAY_STATUS_CANCELED = 5;         // User canceled
    EXTENSION_DISPLAY_STATUS_SUPERSEDED = 6;       // Replaced by newer extension
    EXTENSION_DISPLAY_STATUS_TERMINATED = 7;       // Access ended (revoked/expired) while pending
}

enum ResourceType {
    RESOURCE_TYPE_UNSPECIFIED = 0;
    ACCESS = 1;
    GROUP = 2;
    ROLE = 3;
    RESOURCE_TYPE_CUSTOM = 4;
    // This is a bad long term pattern, but this is the best
    // way to do this to get something out the door fast for an important customer.
    RESOURCE_TYPE_ENTRA_SECURITY_GROUP = 5;
    RESOURCE_TYPE_ENTRA_MICROSOFT_365_GROUP = 6;
    // Ingested "team" resources (e.g. GitHub / Buildkite teams).
    RESOURCE_TYPE_TEAM = 7;
}

// UserIngestionConfig is the per-app-instance toggle row that drives whether
// svflow ingests raw IdP user payloads for that app and dispatches them to
// svstore as user-extension records.
message UserIngestionConfig {
    string id = 1;
    string team_id = 2;
    string app_instance_id = 3;
    bool enabled = 4;
    google.protobuf.Timestamp created_at = 5;
    google.protobuf.Timestamp updated_at = 6;
    // Custom user ingestion: the team workflow replacing the service builtin
    // for this app instance. Absent = the builtin runs implicitly.
    optional string workflow_id = 7;
    // Customer-chosen minimum seconds between scheduled syncs. Absent =
    // platform default cadence.
    optional int32 sync_interval_seconds = 8;
    // Whether the end-of-sync reconcile may deactivate users absent from a
    // custom-workflow sync (builtin syncs always reconcile).
    bool sync_deactivations = 9;
	// Whether user sync may create a Serval user for an email matching nobody;
	// no integration ceiling exists on this side. Optional so a backend
	// predating the field reads as absent (fall back to allowed), not "off".
    optional bool allow_create_new_users = 10;
    optional bool exclude_guest_users = 11;
}

message LastLoginIngestionConfig {
    string id = 1;
    string team_id = 2;
    string app_instance_id = 3;
    bool enabled = 4;
    google.protobuf.Timestamp created_at = 5;
    google.protobuf.Timestamp updated_at = 6;
    optional string workflow_id = 7;
    optional int32 sync_interval_seconds = 8;
}

// A resource type's membership source in one app: up to two team workflows
// Serval runs once per resource of the type, the entitlement workflow first.
// Each run records the resource's roles, then who holds them.
message ResourceUserIngestionConfig {
    string id = 1;
    string app_instance_id = 2;
    // The resource type it covers, e.g. "repository"; every live resource of
    // the type in the app runs it.
    string resource_type_slug = 10;
    bool enabled = 3;
    // The entitlement user workflow: returns ExternalResourceUserSyncResult
    // pages of who holds each of the resource's roles.
    optional string entitlement_user_workflow_id = 4;
    // Unset runs on the app's interval, else every four hours.
    optional int32 sync_interval_seconds = 5;
    // An account no Serval user matches creates one.
    bool allow_create_new_users = 7;
    // The entitlement workflow: returns ExternalResourceEntitlementSyncResult
    // pages of the resource's roles, creating the ones it lacks. Unset,
    // holders match only roles the resource already has.
    optional string entitlement_workflow_id = 11;
    google.protobuf.Timestamp created_at = 8;
    google.protobuf.Timestamp updated_at = 9;
}

// How a membership field's values parse, show and sort in access reviews.
enum MembershipFieldType {
    MEMBERSHIP_FIELD_TYPE_UNSPECIFIED = 0;
    MEMBERSHIP_FIELD_TYPE_TEXT = 1;
    MEMBERSHIP_FIELD_TYPE_NUMBER = 2;
    MEMBERSHIP_FIELD_TYPE_BOOLEAN = 3;
    // RFC 3339, YYYY-MM-DD, or Unix seconds or milliseconds.
    MEMBERSHIP_FIELD_TYPE_DATE = 4;
}

// An org-wide review column for a field membership sources report about each
// account. Its id is the column's identity in every review and export.
message MembershipFieldDefinition {
    string id = 1;
    string name = 2;
    // Never changes after creation.
    MembershipFieldType type = 3;
    // One of the core account fields every review shows (created date, last
    // login). Built-ins have fixed ids, can't be renamed, and no source maps
    // a key to one: the core keys fill them by alias.
    bool builtin = 4;
    // The built-in's key among an account's core facts; empty for an admin's
    // definition.
    string canonical_key = 5;
}

// A membership source shows one top-level key of the external_raw_data its
// runs write on each grant as a field definition's column.
message MembershipFieldMapping {
    string key = 1;
    string field_definition_id = 2;
    // The definition's name and type, on reads; ignored on writes.
    string field_name = 3;
    MembershipFieldType field_type = 4;
}
enum IntegrationMethod {
    NONE = 0;
    OAUTH2_AUTH_CODE = 1;
    OAUTH2_CLIENT_CREDENTIALS = 2;
    API_KEY = 3;
    // Requires some custom data to be stored
    CUSTOM_DATA = 4;
    // Entirely custom integration which
    // does not fit into the above categories
    CUSTOM = 5;
}

// How a custom-service connection authenticates. Mirrors the
// custom_service_api_config.api_auth_type DB enum; surfaced on reads so the
// connection-config UI can reopen a saved connection on the correct auth tab
// (notably a delegated-OIDC connection) instead of inferring it from credential
// rows, which don't exist for per-user delegated connections.
enum CustomServiceAuthType {
    CUSTOM_SERVICE_AUTH_TYPE_UNSPECIFIED = 0;
    CUSTOM_SERVICE_AUTH_TYPE_API_KEY = 1;
    CUSTOM_SERVICE_AUTH_TYPE_OAUTH_CLIENT_CREDENTIALS = 2;
    CUSTOM_SERVICE_AUTH_TYPE_DELEGATED_OIDC = 3;
    CUSTOM_SERVICE_AUTH_TYPE_OAUTH_JWT_BEARER = 4;
}

message CustomServiceAPIConfig {
    string base_url = 1;
    string token_url = 2;
    string auth_header_name = 3;
    repeated RedactedCustomAuthHeader auth_headers = 4;
    // Marks this custom service as an external MCP server (Model Context
    // Protocol): its tools are discovered and ingested as workflows. The MCP
    // endpoint URL is base_url + mcp_endpoint_path. Presence is the enabled
    // signal — a set path means MCP-enabled (must be a non-empty root-relative
    // path, e.g. "/mcp"); unset means not an MCP server.
    //
    // Optional (presence-aware): a SetCustomIntegrationConfig update that omits
    // mcp_endpoint_path leaves the persisted MCP setting untouched, so a partial
    // or older caller that doesn't send it can't silently turn MCP off.
    optional string mcp_endpoint_path = 6;

    // Marks this custom service as an external A2A (Agent-to-Agent) agent: its
    // skills are discovered from the agent card and ingested as workflows. The
    // agent card URL is base_url + a2a_agent_card_path (the conventional path is
    // "/.well-known/agent-card.json"); the card's `url` field is the JSON-RPC
    // endpoint the send-message action posts to. Presence is the enabled signal
    // — a set path means A2A-enabled (must be a non-empty root-relative path);
    // unset means not an A2A agent. A connection is at most one of MCP or A2A.
    //
    // Auth is unchanged: A2A agents authenticate via api_auth_type
    // (delegated_oidc for the per-user OIDC bearer the agent expects).
    //
    // Optional (presence-aware): an update that omits a2a_agent_card_path leaves
    // the persisted A2A setting untouched (same rationale as mcp_endpoint_path).
    optional string a2a_agent_card_path = 8;

    // How this connection authenticates (read-only on this message; writes go
    // through SetCustomIntegrationConfig's integration_auth oneof). Lets the UI
    // reopen a saved connection on the correct auth tab. A delegated_oidc value
    // with mcp_endpoint_path set is an MCP connection; without it, a plain
    // delegated-OIDC HTTP connection.
    CustomServiceAuthType auth_type = 9;

    // The delegated-OIDC connection's currently-linked provider id (from
    // app_instance_oidc_providers), so the config UI can preselect it in the
    // provider picker. Optional (presence-aware): unset when the connection has
    // no linked provider.
    optional string oidc_provider_id = 10;

    // Extra parameters sent in the OAuth client-credentials token-request POST
    // body (form-encoded), alongside the always-present grant_type. For token
    // endpoints that require body params the token URL can't carry — e.g.
    // Workday's `tenant_alias` — especially when the provider rejects query
    // params on the token URL. Sent body-only: the token URL is used verbatim
    // with no query string appended, so these reach the provider in the body
    // and nowhere else.
    //
    // Presence-aware (wrapped in a message, mirroring mcp_endpoint_path): a
    // SetCustomIntegrationConfig update that OMITS this leaves the persisted
    // params untouched, so a partial/older caller can't silently wipe them; a
    // present value (even an empty map) REPLACES the stored set. A bare proto3
    // map couldn't express "unset" vs "cleared".
    OAuthTokenBodyParams oauth_token_body_params = 11;

    // PEM bundle of CA certificate(s) the proxy trusts for this connection's
    // upstream TLS handshake, in addition to the public roots — for an internal
    // host whose certificate a private CA signed. Applies to this connection
    // only, never to the worker as a whole. A CA certificate is public, so reads
    // return it in full.
    //
    // Presence-aware on writes (mirroring mcp_endpoint_path): an update that
    // omits it leaves the stored bundle untouched; "" clears it; a non-empty
    // value replaces it. Every certificate must be a CA or self-signed and
    // currently valid.
    optional string ca_certificate_pem = 12;
    JWTBearerConfig jwt_bearer_config = 13;
}

message JWTBearerConfig {
    string token_url = 1;
    string audience = 2;
    // An empty subject uses the issuer from the signing credential.
    string subject = 3;
    string key_id = 4;
}

// OAuthTokenBodyParams wraps the token-request body params so the field is
// presence-aware on CustomServiceAPIConfig (see field 11).
message OAuthTokenBodyParams {
    map<string, string> params = 1;
}

message RedactedCustomAuthHeader {
    string auth_type = 1;
    string header_name = 2;
    int32 value_length = 3;
    string value_last_four = 4;
    int32 display_order = 5;
}

// A2AAgentCard is the agent card captured by the last A2A discovery sync for an
// app instance: the external agent's self-description plus the Serval-side
// context (generated send-message workflow, sync time).
message A2AAgentCard {
    string name = 1;
    string description = 2;
    // The agent's preferred A2A JSON-RPC endpoint, from the card's `url` field.
    string url = 3;
    string version = 4;
    repeated A2AAgentSkill skills = 5;
    // The generated send-message workflow that routes requests to this agent.
    optional string workflow_id = 6;
    optional google.protobuf.Timestamp last_synced_at = 7;
    // How the agent says it must be authenticated. Empty both for agents that
    // declare nothing and for cards synced before this was captured — a
    // re-sync repopulates it, same as every other card field.
    repeated A2AAgentSecurityScheme security_schemes = 8;
}

// A2AAgentSecurityScheme is one authentication scheme an agent card declares,
// normalized from the two mutually invalid wire encodings (A2A v0.3's flat
// `type`-discriminated object, v1.0's one-key oneof envelope) by the extraction
// workflow. Third-party input: bounded at capture, and never trusted as
// authorization — it describes what the agent ASKS for, which is what makes it
// worth comparing against the provider an operator actually bound.
message A2AAgentSecurityScheme {
    // The card's own key for this scheme. Unique within a card.
    string name = 1;
    A2AAgentSecuritySchemeKind kind = 2;
    // Set only for OPEN_ID_CONNECT: the OIDC discovery document URL.
    string open_id_connect_url = 3;
    // Set only for OAUTH2, and only when the scheme published exactly one flow
    // (all v1.0 can express; the norm in v0.3). One of authorizationCode,
    // clientCredentials, deviceCode, implicit, password. A free-form string
    // rather than an enum because the value is the agent's, not Serval's, and
    // a newer spec may add flows — same reasoning as AgentInterface's
    // protocolBinding.
    string flow = 4;
    // Set only for OAUTH2: RFC 8414 authorization-server metadata URL.
    string oauth2_metadata_url = 5;
    // Scope names the scheme advertises. NEITHER A2A version carries an RFC
    // 8707 resource field, so a required audience can appear only here, inside
    // a scope string (e.g. "api://<app-id>/.default"). That makes these strings
    // the only machine-readable statement of which API the agent's tokens must
    // be addressed to.
    repeated string scopes = 6;
}

enum A2AAgentSecuritySchemeKind {
    A2A_AGENT_SECURITY_SCHEME_KIND_UNSPECIFIED = 0;
    A2A_AGENT_SECURITY_SCHEME_KIND_OPEN_ID_CONNECT = 1;
    A2A_AGENT_SECURITY_SCHEME_KIND_OAUTH2 = 2;
    A2A_AGENT_SECURITY_SCHEME_KIND_API_KEY = 3;
    A2A_AGENT_SECURITY_SCHEME_KIND_HTTP = 4;
    A2A_AGENT_SECURITY_SCHEME_KIND_MUTUAL_TLS = 5;
}

message A2AAgentSkill {
    string id = 1;
    string name = 2;
    string description = 3;
    repeated string tags = 4;
    repeated string examples = 5;
    // Media types the skill accepts/returns (e.g. "text/plain").
    repeated string input_modes = 6;
    repeated string output_modes = 7;
}

message AssetCapabilityConfig {
    repeated string supported_asset_types = 1;
}

message Service {
    string name = 1;
    string display_name = 2;
    string domain = 3;
    string logo_url = 4;
    IntegrationMethod integration_method = 5;
    CustomServiceAPIConfig custom_api_config = 6;
    bool has_subresource_config = 7;
    bool is_custom = 8;
    bool use_integrated_service_registry = 9;
    bool has_user_config = 10; // TODO: This, along with the subresource config, should not need to be fetched from the backend with the new integration system.
    bool has_app_config = 11;
    optional AssetCapabilityConfig asset_config = 12;
    bool has_workflow_ingestion = 13; // Workflow ingestion capability (e.g., ServiceNow catalog items)
    string unique_custom_app_alias = 14;
    bool has_access_profile_ingestion = 15; // Access profile ingestion capability (e.g., ServiceNow user criteria)
    // Whether this service implements per-user ("user-auth") auth — i.e. its
    // backend implements integratedservice.UserScopedAuth. Drives the generic
    // "Connect your account" affordance in the UI for any such service (Workday,
    // future ones), so nothing service-specific is hardcoded client-side.
    bool supports_user_scoped_auth = 16;
    bool has_last_login_config = 17;
}

message ServiceMeta {
    string display_name = 1;
    string domain = 2;
    string logo_url = 3;
    // For service returned by new style integration.
    // Tells client to use local service registry for this service (i.e. logo_url will not be set)
    bool use_integrated_service_registry = 4;
    // Service name (slug) used to look up service in the integration registry
    string name = 5;
}

// Used when presenting info about an approval request to the approving
// user
message ApprovalRequestTask {
    string id = 1;
    google.protobuf.Timestamp created_at = 2;
    string name = 3;
    string description = 4;
    ApprovalRequestResult result = 5;
}

// Used when presenting info about an approval request on
// a ticket
message ApprovalRequest {
    string id = 1;
    google.protobuf.Timestamp created_at = 2;
    oneof for_resource {
        string access_request_id = 3;
        string workflow_run_id = 4;
        string inline_run_id = 8;
    }
    ApprovalRequestResult result = 5;
    repeated ApprovalRequestStep steps = 6;
    // Free-text reason supplied by the requester. Currently only populated
    // for inline approvals (the SDK's `requestApproval` action).
    optional string reason = 7;
    // Controls whether approvers are asked for a justification when deciding.
    // Valid values: "not_requested", "optional", "required".
    string approver_justification_mode = 9;
    // Custom approve/deny button labels. Populated only for inline
    // approvals where the SDK caller passed `approveButtonLabel` /
    // `denyButtonLabel`. Absent for pre-run workflow approvals and
    // access-policy approvals; renderers must fall back to the
    // channel-default "Approve" / "Deny" labels when not set.
    optional string approve_button_label = 10;
    optional string deny_button_label = 11;
    optional google.protobuf.Timestamp last_reminded_at = 12;
    bool can_remind = 13;
    // Absent means unresolved; empty means no human beneficiary. Never the on-behalf initiator.
    optional string requester_user_id = 14;
    ApprovalRequestKind request_kind = 15;
    // The buttons the request offers, in order; empty answers with approve
    // and deny. Shown only where the team has this option.
    repeated ApprovalAction actions = 16;
    // True when the actions are the default set supplied by svflow.
    bool default_actions = 17;
}

// What an approval request asks of a person; UNSPECIFIED is an approval.
// Option C, a generic HumanRequest with ApprovalRequest on top, is the planned
// follow-up; request_kind is the bridge until then.
enum ApprovalRequestKind {
    APPROVAL_REQUEST_KIND_UNSPECIFIED = 0;
    APPROVAL_REQUEST_KIND_APPROVAL = 1;
    APPROVAL_REQUEST_KIND_HUMAN_TASK = 2;
}

// One button a request offers, as it was asked. Stored as JSON in svinbox
// metadata, so the names are final.
message ApprovalAction {
    // What SetApprovalRequestStepApproverResultRequest.action_id sends back.
    string id = 1;
    string label = 2;
    // primary | secondary | danger
    string style = 3;
    // APPROVED or DENIED: the result pressing it records.
    ApprovalRequestResult outcome = 4;
    // Asked before the answer is sent, with the label as its title. Empty
    // sends at once.
    string confirm = 5;
    // none | optional | required: a free-text reason asked when pressed.
    string reason = 6;
    // False: pressing it does not hold the answer to the form's required
    // fields.
    bool validate_fields = 7;
}

message ApprovalRequestStep {
    string id = 1;
    int32 number = 2;
    repeated ApprovalRequestStepApprover approvers = 3;
    string result_set_by_user_id = 4; // Assumes one approver per step, this could change in future
    ApprovalRequestResult result = 5;
    bool is_auto_approved = 6;

    // Custom workflow run information (if this step uses a custom approval workflow)
    optional ApprovalRequestStepCustomWorkflowRun custom_workflow_run = 7;

    // Configured approver sources for future steps (populated when approvers
    // haven't been resolved yet, i.e. the step hasn't been activated).
    // Each entry describes a source type (group, manager, app owner).
    repeated ConfiguredApproverSource configured_approver_sources = 8;
    // Controls whether approvers are asked for a justification when deciding this step.
    // Valid values: "not_requested", "optional", "required".
    string approver_justification_mode = 9;
    // Parallel grouping for staged inline approvals. Absent on legacy backend
    // responses, where clients should treat number as the singleton stage.
    optional int32 stage_number = 10;
    bool supports_dynamic_delegation = 11;
    // Decides only once the stage_number step it backs up escalates.
    bool is_fallback = 12;
}

message ApprovalDelegationContext {
    bool supports_dynamic_delegation = 1;
    optional string requester_user_id = 2;
}

enum ConfiguredApproverSourceType {
    CONFIGURED_APPROVER_SOURCE_TYPE_UNSPECIFIED = 0;
    CONFIGURED_APPROVER_SOURCE_TYPE_GROUP = 1;
    CONFIGURED_APPROVER_SOURCE_TYPE_MANAGER = 2;
    CONFIGURED_APPROVER_SOURCE_TYPE_APP_OWNER = 3;
    CONFIGURED_APPROVER_SOURCE_TYPE_TEAM_OWNER = 4;
    CONFIGURED_APPROVER_SOURCE_TYPE_RESOURCE_OWNER = 5;
    CONFIGURED_APPROVER_SOURCE_TYPE_ROLE_OWNER = 6;
}

message ConfiguredApproverSource {
    ConfiguredApproverSourceType type = 1;
    string id = 2;  // group_id for GROUP type; empty for MANAGER/APP_OWNER
}

message ApprovalRequestStepCustomWorkflowRun {
    string run_id = 1;
    WorkflowRunStatus status = 2;
    optional bool is_auto_approved = 3;
    optional string reason = 4;
    string workflow_id = 5;
}

enum ApprovalRequestUserType {
    APPROVAL_REQUEST_USER_TYPE_UNSPECIFIED = 0;
    PRIMARY = 1;
    SECONDARY = 2;
    // Team-level designated override approver, not part of any approval
    // procedure and never notified. A resolution/approver row carries this
    // type only once such an approver has actually acted on a step.
    OVERRIDE = 3;
}

message ApprovalRequestStepApprover {
    string id = 1;
    string user_id = 2;
    ApprovalRequestResult result = 3;
    bool is_auto_approved = 4;
    ApprovalRequestUserType user_type = 5;
    google.protobuf.Timestamp result_set_at = 6;
    // Free-text justification supplied by this approver alongside their decision.
    optional string justification = 7;
    // If this approver was assigned by a delegation rule, the id of the user the
    // approval was originally routed to (the start of the delegation chain),
    // reconstructed from delegation_resolutions. Unset for direct approvers.
    optional string delegated_from_user_id = 8;
    // The action recorded when this approver answered the request.
    optional string action_id = 9;
}

message OnBehalfOfConfirmationRequest {
    string id = 1;
    google.protobuf.Timestamp created_at = 2;
    oneof for_resource {
        string access_request_id = 3;
        string workflow_run_id = 4;
    }
    string by_user_id = 5;
    string for_user_id = 6;
    ApprovalRequestResult result = 7;
}

enum WorkflowRunStatus {
    WORKFLOW_RUN_STATUS_UNSPECIFIED = 0;
    WORKFLOW_RUN_STATUS_PENDING = 1;
    WORKFLOW_RUN_STATUS_RUNNING = 2;
    WORKFLOW_RUN_STATUS_COMPLETED = 3;
    WORKFLOW_RUN_STATUS_FAILED = 4;
    WORKFLOW_RUN_STATUS_DENIED = 5;
    WORKFLOW_RUN_STATUS_CANCELED = 6;
}

// AccessRequestStatus represents the overall status of an access request.
// Used by the public API for SDK consumers.
enum AccessRequestStatus {
    ACCESS_REQUEST_STATUS_UNSPECIFIED = 0;
    // The access request is pending approval.
    ACCESS_REQUEST_STATUS_PENDING = 1;
    // The access request was approved and access is currently active.
    ACCESS_REQUEST_STATUS_APPROVED = 2;
    // The access request was denied.
    ACCESS_REQUEST_STATUS_DENIED = 3;
    // The access was provisioned and has since expired.
    ACCESS_REQUEST_STATUS_EXPIRED = 4;
    // The access was revoked before expiration.
    ACCESS_REQUEST_STATUS_REVOKED = 5;
    // The access request was canceled by the requester.
    ACCESS_REQUEST_STATUS_CANCELED = 6;
    // The provisioning of access failed.
    ACCESS_REQUEST_STATUS_FAILED = 7;
}

message WorkflowRunMeta {
    string run_id = 1;
    WorkflowMeta workflow_meta = 2;
    google.protobuf.Timestamp created_at = 3;
    string arguments = 4;
    WorkflowRunStatus run_status = 5;
    string run_result = 6;
    optional .svflow.common.models.ApprovalRequest approval_request = 7;
    optional string linked_ticket_id = 8;
    optional string initiated_by_trigger_id = 9; // Polymorphic ID — interpretation depends on initiated_by_trigger_type
    optional .svflow.common.models.OnBehalfOfConfirmationRequest on_behalf_of_confirmation_request = 10;
    repeated .svflow.common.models.Task tasks = 11;
    string for_user_id = 12;
    string by_user_id = 13;
    string team_id = 14;
    // When the run completed (for any terminal state)
    optional google.protobuf.Timestamp completed_at = 16;
    optional TriggerType initiated_by_trigger_type = 17;
    optional string request_source_ip = 18;
    optional string request_user_agent = 19;
    // If this workflow is running as a custom approval workflow for an approval request
    optional string for_approval_request_id = 20;
    // Child workflow runs triggered by this workflow
    repeated ChildWorkflowRun child_workflow_runs = 21;
    // Parent workflow run info (if this is a child workflow)
    optional ParentWorkflowRun parent_workflow_run = 22;
    // Validation errors from a ValidationError thrown in workflow code.
    // Only populated when the run status is FAILED.
    optional ValidationErrors validation_errors = 23;
    // Only populated when the workflow call belongs to a status_check
    // relationship and run_status is COMPLETED.
    optional StatusCheckResult status_check_result = 24;
    // Inline approval requests (distinct from the pre-run approval gate in field 7)
    repeated .svflow.common.models.ApprovalRequest inline_approval_requests = 25;
    // When the current run status was last updated.
    optional google.protobuf.Timestamp status_updated_at = 26;
    // Shared (cross-team proxy) run provenance — set only when the run was
    // initiated by a team this workflow is shared with. team_id (field 14)
    // remains the owning/execution team; by_user_id (field 13) is the
    // requesting-team caller the run executed as. id and name are always
    // populated together (name resolved by the serving handler), so they are
    // grouped into a sub-message to make that co-presence explicit.
    optional SharedRunProvenance shared_run_provenance = 30;
    // The workflow version this run executed, when a version was pinned at
    // dispatch time. Unset when no version was recorded on the run
    // (trigger-initiated runs and runs predating version stamping resolved
    // the deployed version at execution time without persisting it).
    optional RunWorkflowVersion workflow_version = 31;
    // Stable 1-based ordinal of this run within its workflow's full run
    // history, oldest = 1 (the "Run #N" label). Computed server-side over the
    // *unfiltered* history so the number identifies the same run whether or
    // not the caller filtered the list. Only populated by list endpoints that
    // rank their results; unset elsewhere, where callers should fall back to
    // deriving a position from the list itself.
    optional int64 run_number = 32;
    // What started the run; values match svflow's trigger_source_type DB enum
    // ('meta_agent', 'event', 'help_agent', …). Unset for runs recorded
    // before trigger_source stamping.
    optional string trigger_source = 33;
    // True when integration access hid this run's steps and result from the
    // caller. run_result is blank either way, so a list view has no other way
    // to tell "withheld" from "produced nothing".
    bool result_withheld = 34;
    // The version the run executed: the one its start recorded, or before it
    // starts the one it asked for. Unset when it has neither, when it did not
    // record whether that was the published version (every run from before
    // ran_published_version), for a built-in, and in the run metas svflow's
    // private BatchGetWorkflowRuns and ListEventTriggeredWorkflowRunsForTicket
    // build from bare request rows.
    optional RunExecutedVersion executed_version = 35;
    reserved 27, 28, 29;
    reserved "requesting_team_id", "requesting_team_name", "requested_by_user_id";
}

// RunWorkflowVersion identifies the workflow version a run executed.
// file_version_id and version_number match the same-named fields on the
// user service's WorkflowVersion (ListWorkflowVersions); version_number is
// the display ordinal ("v10").
message RunWorkflowVersion {
    string file_version_id = 1;
    int32 version_number = 2;
}

// RunExecutedVersion is the version a run executed.
message RunExecutedVersion {
    RunWorkflowVersion version = 1;
    // The run asked for a version that was not the published one when it was
    // requested, as the draft-run gate judges it. Never true for a run that
    // asked for no version: its worker loads the published module.
    bool draft = 2;
}

// SharedRunProvenance identifies the team that initiated a cross-team shared
// run. Present on WorkflowRunMeta only for shared (proxy) runs.
message SharedRunProvenance {
    string requesting_team_id = 1;
    // Display name of the requesting team, resolved by the serving handler
    // (the viewer may not be a member of that team).
    string requesting_team_name = 2;
}

message StatusCheckResult {
    bool is_complete = 1;
    // The message appropriate for the current status (pending or success).
    string message = 2;
    // Per-language translations of the message. Key = BCP 47 code.
    map<string, string> message_translations = 3;
}

// Validation error details surfaced from a workflow's ValidationError.
message ValidationErrors {
    // General banner message shown above the form.
    string display_message = 1;
    // Per-field error messages. Keys are workflow input parameter names.
    map<string, string> field_errors = 2;
    // Per-language translations of error messages. Key = BCP 47 language code.
    map<string, ValidationErrorTranslations> translations = 3;
}

message ValidationErrorTranslations {
    string display_message = 1;
    map<string, string> field_errors = 2;
}

// Information about a child workflow run triggered by a parent workflow
message ChildWorkflowRun {
    string run_id = 1;
    int64 parent_step = 2; // The step in the parent workflow that triggered this child
    string workflow_id = 3;
    string workflow_name = 4;
    string team_id = 5;
    optional WorkflowRunStatus run_status = 6;
    optional google.protobuf.Timestamp created_at = 7;
    optional ApprovalRequest approval_request = 8;
    repeated ChildWorkflowRun child_workflow_runs = 9;
    bool has_active_inline_approval = 10;
    // Set as on WorkflowRunMeta.executed_version.
    optional RunExecutedVersion executed_version = 11;
}

// Information about the parent workflow run (when this is a child workflow)
message ParentWorkflowRun {
    string run_id = 1;
    string workflow_id = 2;
    string workflow_name = 3;
    string team_id = 4;
}

enum TriggerType {
    TRIGGER_TYPE_UNSPECIFIED = 0;
    TRIGGER_TYPE_SCHEDULE = 1;
    TRIGGER_TYPE_WEBHOOK = 2;
    TRIGGER_TYPE_EVENT = 3;
    TRIGGER_TYPE_SLA = 4;
    TRIGGER_TYPE_HELP_AGENT = 5;
    TRIGGER_TYPE_META_AGENT = 6;
    TRIGGER_TYPE_USER = 7;
    TRIGGER_TYPE_API = 8;
    TRIGGER_TYPE_HEALTH_CHECK = 9;
    TRIGGER_TYPE_CHILD_WORKFLOW = 10;
    TRIGGER_TYPE_ROUTING_RULE = 11;
    TRIGGER_TYPE_INGESTION = 12;
    TRIGGER_TYPE_APPROVAL = 13;
    TRIGGER_TYPE_ESCALATION = 14;
    // A barcode scan session started the run (per-scan verb, curated
    // selection, or session close-out). Derived server-side from the
    // presence of DatabaseAuditContext on the private RunWorkflow call.
    TRIGGER_TYPE_SCAN = 15;
    TRIGGER_TYPE_ENTITY_WORKFLOW = 16;
    TRIGGER_TYPE_CI_CHECK = 17;
    TRIGGER_TYPE_DASHBOARD_REFRESH = 18;
    TRIGGER_TYPE_ACCESS_REVIEW_REPORT = 19;
    // An App Builder endpoint call started the run; the trigger id is the
    // app version whose workflow ran.
    TRIGGER_TYPE_APP = 20;
}

// A workflow's target user: the single person a run acts on.
//
// Presence is the answer to "does this workflow act on somebody" — the message
// is set, possibly empty, exactly when it does. That co-presence is the point:
// a surface that knows a run needs a person but not who they are renders a
// picker it cannot label, which is what the separate boolean allowed.
//
// Producers MUST emit an empty message rather than omitting it when a workflow
// has a target user the author never described. Omitting it turns the picker
// off.
message TargetUserConfiguration {
    // The author's one-line answer to "who is this workflow's target user",
    // from `context.TargetUser<{ description }>` in the workflow source.
    // Absent when they declared none.
    optional string description = 1;
}

message WorkflowMeta {
    string id = 1;
    string name = 2;
    bool is_builtin = 3;
    repeated ServiceMeta services = 4;
    bool is_deleted = 5;
    // Superseded by target_user, whose presence carries the same answer.
    // Still populated for clients that predate that field; drop and reserve
    // once no deployed client reads it.
    bool runs_in_current_user_context = 6 [deprecated = true];
    bool is_temporary = 7;
    google.protobuf.Timestamp disabled_at = 8;
    bool never_published = 9;
    bool has_unpublished_edits = 10;
    int32 num_workflow_runs = 11;
    google.protobuf.Timestamp latest_run_requested_at = 12;
    // Optional URL to a custom workflow icon. Empty means use the
    // default emoji / initials-derived avatar.
    optional string icon_url = 13;
    // Set when this workflow is visible to the requesting team only via an
    // active cross-team share (black-box view — no builder access).
    optional SharedFromTeam shared_from_team = 14;
    // Present exactly when the workflow acts on a specific person.
    optional TargetUserConfiguration target_user = 15;
    // Fixed approval-only workflow; use the ordinary run/approval lifecycle.
    bool is_noop_workflow = 16;
    // Whether the source this meta was read from declares a workflow test.
    // False when no source was read, such as a builtin workflow's run.
    bool is_workflow_test = 17;
    bool is_synced_from_external = 18;
}


enum AccessRequestConclusionReason {
    ACCESS_REQUEST_CONCLUSION_REASON_UNSPECIFIED = 0;
    ACCESS_REQUEST_CONCLUSION_REASON_DENIED = 1;
    ACCESS_REQUEST_CONCLUSION_REASON_TIMED_OUT = 2;
    ACCESS_REQUEST_CONCLUSION_REASON_SCHEDULED_DEPROVISION = 3;
    ACCESS_REQUEST_CONCLUSION_REASON_PROVISION_FAILED = 4;
    ACCESS_REQUEST_CONCLUSION_REASON_APP_INSTANCE_NOT_FOUND = 5;
    ACCESS_REQUEST_CONCLUSION_REASON_ENTITLEMENT_REMOVED = 6;
    ACCESS_REQUEST_CONCLUSION_REASON_CANCELED = 7;
    ACCESS_REQUEST_CONCLUSION_REASON_REQUEST_ALREADY_IN_PROGRESS = 8;
    ACCESS_REQUEST_CONCLUSION_REASON_INVALID_REQUEST = 9;
    ACCESS_REQUEST_CONCLUSION_REASON_REVOKED = 10;
    ACCESS_REQUEST_CONCLUSION_REASON_DEPROVISION_FAILED = 11;
    ACCESS_REQUEST_CONCLUSION_REASON_MANUAL_DEPROVISION_OVERRIDE = 12;
    ACCESS_REQUEST_CONCLUSION_REASON_ACCESS_ALREADY_EXISTS = 13;
    // The request was replaced by a newer request the same user started for the
    // same entitlement before this one had provisioned. The system auto-concludes
    // the older request — the user did NOT cancel it. Rendered as "Replaced by a
    // newer request" rather than "Canceled by <user>".
    ACCESS_REQUEST_CONCLUSION_REASON_SUPERSEDED = 14;
    // Deprovision fail-fast: the target resource was deleted while its app
    // instance survives. Distinct from ENTITLEMENT_REMOVED, which records access
    // observably ending.
    ACCESS_REQUEST_CONCLUSION_REASON_RESOURCE_NOT_FOUND = 15;
    // Deprovision fail-fast: the target entitlement row was deleted while its
    // resource and app instance survive.
    ACCESS_REQUEST_CONCLUSION_REASON_ENTITLEMENT_NOT_FOUND = 16;
    // An approver changed the request to another role on the same resource
    // before it provisioned. Not a cancel: the replacement request
    // (rerouted_to) carries the same ticket, requester and justification.
    ACCESS_REQUEST_CONCLUSION_REASON_REROUTED = 17;
    // The request expired or was revoked while a birthright profile still
    // justified the grant, so it concluded without a deprovision run.
    ACCESS_REQUEST_CONCLUSION_REASON_JUSTIFIED_BY_PROFILE = 18;
}

// One end of a reroute: the request on the other side and the role it is for.
message AccessRequestRerouteLink {
    string access_request_id = 1;
    string entitlement_id = 2;
    string entitlement_name = 3;
}


message AccessRequest {
    string id = 1;
    google.protobuf.Timestamp created_at = 2;
    string for_user_id = 3;
    Entitlement entitlement = 4;
    int32 access_minutes = 5; // Original requested minutes (deprecated in favor of current_access_minutes)
    string business_justification = 6;
    string provision_run_id = 7;
    google.protobuf.Timestamp provision_run_completed_at = 8;
    string deprovision_run_id = 9;
    google.protobuf.Timestamp deprovision_run_completed_at = 10;
    google.protobuf.Timestamp concluded_at = 11;
    AccessRequestConclusionReason conclusion_reason = 12;
    google.protobuf.Timestamp expires_at = 13;
    bool access_is_valid = 14; // Indicates if the access request is still valid (i.e. not concluded or expired)
    optional .svflow.common.models.ApprovalRequest approval_request = 15;
    string ticket_id = 16;
    repeated Entitlement linked_entitlements = 17; // If other entitlements were provisioned as linked entitlements
    google.protobuf.Timestamp provision_run_started_at = 18;
    google.protobuf.Timestamp deprovision_run_started_at = 19;
    string canceled_by_user_id = 20;
    string revoked_by_user_id = 21;
    string by_user_id = 22;
    
    // Current allocation info (may differ from original access_minutes after extensions)
    int32 current_access_minutes = 23; // Current allocation's approved minutes (0 = unlimited)
    repeated AccessRequestAllocationEvent allocation_events = 24; // History of allocations for timeline
    
    // Pending extension info (if one exists)
    optional PendingExtension pending_extension = 25;

    // When the access is scheduled to start. If set, provisioning will be delayed
    // until this time. Unset means immediate (the default).
    optional google.protobuf.Timestamp scheduled_start_at = 26;

    // Set on a request concluded REROUTED: who changed it to another role and
    // their note to the requester. rerouted_to is derived from the replacement
    // request and is absent until that request exists.
    string rerouted_by_user_id = 27;
    string rerouted_justification = 28;
    optional AccessRequestRerouteLink rerouted_to = 29;
    // Set on a replacement request: the request it replaced.
    optional AccessRequestRerouteLink rerouted_from = 30;
}

// Represents a pending extension request that is waiting for approval
message PendingExtension {
    string allocation_id = 1;        // ID of the pending allocation
    int32 requested_minutes = 2;     // Total minutes requested (0 = unlimited)
    google.protobuf.Timestamp requested_at = 3;  // When the extension was requested
    string requested_by_user_id = 4; // Who requested the extension
    optional .svflow.common.models.ApprovalRequest approval_request = 5; // Approval status
    int32 previous_minutes = 6;      // Duration BEFORE this extension (what we're extending from)
    ExtensionDisplayStatus display_status = 7; // Always PENDING_APPROVAL for pending extensions
}

// Represents a single allocation event (initial approval or extension) for timeline display
message AccessRequestAllocationEvent {
    google.protobuf.Timestamp timestamp = 1; // When this allocation was created/requested (not when it was approved)
    int32 approved_minutes = 2;              // Total minutes after this allocation (0 = unlimited, -1 = never approved)
    int32 change_minutes = 3;                // Change from previous: +X = extended, -X = shortened, 0 = initial
    string by_user_id = 4;                   // User who requested this allocation (requester)
    string id = 5;                           // Unique ID for this allocation (UUID)
    string approved_by_user_id = 6;          // User who approved this allocation (approver) - may be empty if auto-approved
    int32 requested_minutes = 7;             // What was originally requested (may differ from approved_minutes if modified by approver)
    string invalidation_reason = 8;          // Why this allocation was invalidated: 'superseded', 'canceled', 'rejected', 'concluded'
    ExtensionDisplayStatus display_status = 9; // Pre-computed display status for UI (eliminates frontend state computation)
    google.protobuf.Timestamp result_set_at = 10; // When the approval/denial result was set (from the approver's action)
    bool is_auto_approved_by_workflow = 11; // True if this allocation was auto-approved by a custom approval workflow (no human approver)
    string ticket_id = 12;                   // svhelp ticket backing this allocation (original request or extension)
    string business_justification = 13;      // Justification given for this allocation
}

message ListEntitlementOptions {
    // previous opt-in flags
    // optional bool filter_to_correctly_configured = 1;
    // optional bool filter_to_enabled = 2;
    reserved 1, 2;

    optional bool include_disabled = 3;
    optional bool include_misconfigured = 4;
}

message EntitlementUser {
    string id = 1;
    google.protobuf.Timestamp created_at = 2;
    string entitlement_id = 3;
    string user_id = 4;
    optional AccessRequest access_request = 5;
    string external_id = 6;
    string external_raw_data = 7;
    google.protobuf.Timestamp last_synced_at = 8;
    optional string external_user_id = 9;
    reserved 10, 11;
    reserved "source", "license_reclamation_kept_until";
    Entitlement entitlement = 12;
    // The membership is confirmed by the user being in every group linked to
    // the entitlement. Its record is not removed directly: revoking it takes
    // the user out of those groups.
    bool via_linked_groups = 13;
    // The newest deprovision of this membership that ran without an access
    // request (an ad-hoc revoke, a reclaim, or an access-review remediation).
    // Unset when none has been started.
    optional AccessGrantRevocation revocation = 14;
    // The birthright profile justifying the grant. A grant with a pointer is
    // not removed directly: an exception on the profile is how it goes away.
    optional string birthright_profile_id = 15;
}

// A deprovision of a membership that has no access request behind it.
message AccessGrantRevocation {
    google.protobuf.Timestamp created_at = 4;
    // Unset while the deprovision is still running.
    google.protobuf.Timestamp concluded_at = 1;
    AccessRequestConclusionReason conclusion_reason = 2;
    // The ticket tracking the deprovision: the review's remediation task, the
    // reclaim's ticket, or the revoke's own ticket.
    string ticket_id = 3;
}

message EntitlementUserRow {
    string entitlement_id = 1;
    string entitlement_user_id = 2;
    string user_id = 3;
}

enum SuggestionSetStatus {
    SUGGESTION_SET_STATUS_UNSPECIFIED = 0;
    SUGGESTION_SET_PENDING = 1;
    SUGGESTION_SET_ACCEPTED = 2;
    SUGGESTION_SET_REJECTED = 3;
    SUGGESTION_SET_GENERATING = 4;
    SUGGESTION_SET_FAILED = 5;
}

enum SuggestionType {
    SUGGESTION_TYPE_UNSPECIFIED = 0;
    SUGGESTION_TYPE_CREATE = 1;
    SUGGESTION_TYPE_UPDATE = 2;
}

enum SuggestionSetSourceType {
