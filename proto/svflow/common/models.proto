}

message TicketSourceGroupOption {
    string id = 1;
    string name = 2;
}

message TicketSourceStatusOption {
    string id = 1;
    string name = 2;
    string team_id = 3;
    // Optional: Specifies which external ticket subtype this status option belongs to.
    // For ServiceNow, this can be "incident", "requested_item", or "hr_case".
    // If empty, the status belongs to the default type (e.g., "incident" for ServiceNow).
    string external_ticket_subtype = 4;
    // Jira only: the status category this individual status rolls up to (e.g. "4"
    // / "In Progress"). Lets the frontend group statuses under their category and
    // write category-level (bucket) mappings. Empty for integrations without a
    // category concept (Linear, Zendesk, etc.).
    string status_category_id = 5;
    string status_category_name = 6;
}

message TicketSourcePriorityOption {
    string id = 1;
    string name = 2;
    string team_id = 3;
}

enum TicketSourceFieldType {
    TICKET_SOURCE_FIELD_TYPE_UNSPECIFIED = 0;
    STRING = 1;
    NUMBER = 2;
    BOOLEAN = 3;
    SELECT = 4;
    MULTI_SELECT = 5;
    DATE = 6;
}

message TicketSourceAdditionalField {
    string id = 1;

    // Fields derived from the external system
    string field_name = 2;
    TicketSourceFieldType field_type = 3;
    repeated TicketSourceAdditionalFieldOption field_options = 4;
    bool required = 5; // Whether this field is required for ticket creation in the external system
    bool is_default_field = 6; // Whether this field is a default field for the external system

    // Fields that are set by Serval users
    TicketSourceAdditionalFieldValue default_value = 7;
    bool ai_enabled = 8; // Whether AI should try to set this field
}

message TicketSourceAdditionalFieldOption {
    string id = 1;
    string name = 2;
    repeated TicketSourceAdditionalFieldOption child_options = 3;
}

message TicketSourceAdditionalFieldValue {
    TicketSourceFieldType field_type = 1;
    string str_value = 2;
    double number_value = 3;
    bool bool_value = 4;
    repeated string str_array_value = 5;
    google.protobuf.Timestamp date_value = 6;
}

message KnowledgeSource {
    string id = 1;
    google.protobuf.Timestamp last_sync_started_at = 2;
    google.protobuf.Timestamp last_sync_completed_at = 3;
    bool last_sync_succeeded = 4;
    // TRUE when the last sync completed but did NOT see the whole source (its
    // discovery run ended with errored containers — failed or throttled out).
    // Distinct from last_sync_succeeded rather than a third value of it: such a
    // run genuinely did complete, and older clients that only read
    // last_sync_succeeded must keep rendering it as a success during the
    // backend->frontend deploy gap. New clients show "synced, incomplete".
    bool last_sync_partial = 18;
    // The connector's Temporal error type for a sync failure that cannot clear on
    // its own — today only a revoked credential ("NotionTokenRevoked"). Empty
    // means no such condition.
    //
    // A third state alongside last_sync_succeeded / last_sync_partial rather than
    // a value on either: both of those are consumed by older frontend bundles
    // during the backend->frontend deploy gap, and a terminal failure is neither
    // a success nor an incomplete one. An old bundle ignores this field and keeps
    // rendering exactly what it renders today.
    string terminal_sync_failure_type = 19;
    reserved 5;
    bool searching_enabled = 6;
    bool syncing_enabled = 7;
    bool permissions_sync_enabled = 8; // Always sync permissions during knowledge ingestion (for supported sources)
    bool enforce_ingested_permissions = 9; // Whether to enforce permissions when surfacing knowledge items
    bool cite_knowledge_item_urls = 10; // Whether to include document links in knowledge retrieval and force the help agent to cite them
    bool public_channel_links_only = 11; // When permissions enforced: if true, only send links (not content) in public channels even when user has access
    bool knowledge_creation_enabled = 12; // When true, this source is treated as a write target for new knowledge suggestions; gates the suggester's knowledge-creation tool + prompt for the team
    optional string doc_creation_destination_id = 13; // External ID of the parent page/folder in the source where new knowledge documents will be written (e.g. a Notion page ID)
    // When TRUE, downloaded connector pages are also imported into the
    // team's native knowledge base in place (browsable, read-only copies).
    // Turning it off stops the copy refresh; taking editable ownership is done
    // via Duplicate to Workspace (the in-place cutover concept is retired —
    // 16 = cutover_at stays reserved).
    bool import_to_native_knowledge_base = 14;
    reserved 15, 16;
    reserved "cutover_at";
    // Backend-set. Enabled only when the user manually supplies the SharePoint
    // sites to crawl (the flow for an integration whose Sites.Selected Graph
    // scope 403s tenant-wide site enumeration). Once set, the sync orchestrator
    // runs a scoped crawl of the selected sites instead of enumerating the
    // tenant; if a skip_discovery source has no stored sites, the orchestrator
    // resets this back to false so normal discovery is re-attempted.
    bool skip_discovery = 17;
    // How the help desk agent discloses a knowledge item that matched a
    // question but that the requester cannot read. Only meaningful when
    // enforce_ingested_permissions is TRUE. UNSPECIFIED behaves as SILENT.
    RestrictedMatchDisclosure restricted_match_disclosure = 20;
    // Backend-set, ServiceNow only. Which evaluation path answered which user
    // criteria on the most recent match sweep, and how the fast path's
    // answers have compared with ServiceNow's over time. Unset until a sweep
    // has recorded it.
    optional UserCriteriaSyncPaths user_criteria_sync_paths = 21;
}

// UserCriteriaSyncPaths is the per-sweep split between the two ways Serval
// keeps ServiceNow user criteria in sync. Fast: Serval evaluated the criteria
// itself from a read-only snapshot of the instance. Standard: ServiceNow
// evaluated it per user through the Scripted REST endpoint. Refused: neither
// path could, so the criteria failed closed. Every criteria the fast path
// cannot answer for lack of read access is listed in fast_sync_blockers by the
// table or table.column to grant, so the split moves when the grant lands.
message UserCriteriaSyncPaths {
    // True when the fast path ran on this sweep at all. False means every
    // criteria went through the endpoint because fast sync is not enabled for
    // the organization, not because of missing read access.
    bool fast_sync_attempted = 1;
    int32 fast_path_criteria = 2;
    int32 standard_path_criteria = 3;
    int32 refused_criteria = 4;
    // Wall-clock seconds of each pass on this sweep; the standard figure sums
    // every per-user page.
    int32 fast_path_seconds = 5;
    int32 standard_path_seconds = 6;
    repeated string fast_sync_blockers = 7;
    google.protobuf.Timestamp recorded_at = 8;
    // Cumulative (user, criteria) pairs the endpoint re-checked against the
    // fast path's answers, and how many disagreed.
    int64 validation_pairs = 9;
    int64 validation_disagreements = 10;
    optional google.protobuf.Timestamp validation_last_at = 11;
}

// RestrictedMatchDisclosure is the per-source rule for a knowledge item that
// matched a question but that the requester cannot read. Without it, a
// permission-filtered miss and a genuine absence look identical to the agent
// (both are zero results), so the agent cannot say "this exists but you do not
// have access" and instead searches, fails, and improvises (DLB-609, DLB-592).
enum RestrictedMatchDisclosure {
    RESTRICTED_MATCH_DISCLOSURE_UNSPECIFIED = 0;
    // Treat restricted items as if they do not exist. The agent answers only
    // from what the requester can read. Today's behaviour and the org default.
    RESTRICTED_MATCH_DISCLOSURE_SILENT = 1;
    // Tell the requester that restricted content matched, without titles or
    // links, and offer an access request.
    RESTRICTED_MATCH_DISCLOSURE_ACKNOWLEDGE = 2;
    // Show the item title and the source link; the source enforces access on
    // click. Content is never quoted. In a non-DM channel svflow degrades this
    // to ACKNOWLEDGE as a rule, not a setting.
    RESTRICTED_MATCH_DISCLOSURE_NAME_AND_LINK = 3;
}

message KnowledgeSourceSyncRun {
    string id = 1;
    string knowledge_source_id = 2;
    string run_type = 3;
    google.protobuf.Timestamp started_at = 4;
    optional google.protobuf.Timestamp completed_at = 5;
    optional google.protobuf.Timestamp failed_at = 6;
    optional string failure_message = 7;
    int32 items_added_count = 8;
    int32 items_updated_count = 9;
    int32 items_deleted_count = 10;
    int32 items_unchanged_count = 11;
    int32 items_errored_count = 12;
    optional string parent_run_id = 13;
}

// Aggregate changed fields. Missing details mean the comparison is unavailable,
// including update retries that may have already written data.
message SyncUpdateDetails {
    enum Field {
        UNSPECIFIED = 0;
        NAME = 1;
        DESCRIPTION = 2;
        INPUTS = 3;
        GENERATED_CODE = 4;
        CONFIRMATION = 5;
        RESTORED = 6;
    }
    repeated Field changed_fields = 1;
}

message SyncWorkflowNameConflict {
    string external_id = 1;
    string requested_workflow_name = 2;
    string conflicting_workflow_id = 3;
}

// Recorded import failures, not the conflicting workflows' current state.
message SyncWorkflowNameConflicts {
    repeated SyncWorkflowNameConflict conflicts = 1;
    bool has_more_conflicts = 2;
    bool has_other_errors = 3;
}

enum SyncStatus {
    SYNC_STATUS_UNSPECIFIED = 0;
    SYNC_STATUS_NOT_STARTED = 1;
    SYNC_STATUS_RUNNING = 2;
    SYNC_STATUS_COMPLETED = 3;
    SYNC_STATUS_FAILED = 4;
}

message GuidanceMetadata {
    string guidance_doc_id = 1;
    string guidance_doc_name = 2;
    string latest_version_update_by_user_id = 3;
    google.protobuf.Timestamp latest_version_last_updated_at = 4;
    bool never_published = 5;
    google.protobuf.Timestamp disabled_at = 6;
    string guidance_file_id = 7;
    repeated string guidance_associated_tag_ids = 8;
    string guidance_doc_description = 9;
    bool should_always_use = 10;
    string guidance_doc_content = 11;
    bool has_unpublished_edits = 12;
    // Folder the skill lives in. Unset means the skill lives at the root.
    optional string folder_id = 13;
    // The copy-invariant scoped ID of the guidance (e.g. "skill_...").
    string scoped_id = 14;
    // Discriminates help-desk vs catalyst skills (both are rows in the same
    // guidances table). The frontend re-reads this on every render to route the
    // mention chip, so routing survives markdown round-trips that carry only
    // type + id.
    SkillType skill_type = 15;
    // Creator of the first version and editor of the latest version. Kept
    // separate because an unpublished draft can be edited in place by someone
    // other than its creator.
    string created_by_user_id = 16;
    string latest_version_updated_by_user_id = 17;
    serval.resources.v1.agentchannels.AgentChannelFilter channel_filter = 18;
}

// SkillType discriminates the two skill kinds that share the guidances table.
// It lives here (not in svflow.user) so both the shared metadata messages here
// and the user-facing Skill message can reference it — svflow.user imports
// svflow.common.models, so defining it there would create a package cycle.
enum SkillType {
    SKILL_TYPE_UNSPECIFIED = 0;
    SKILL_TYPE_HELP_DESK = 1;
    SKILL_TYPE_CATALYST = 2;
}

// SkillMetadata mirrors GuidanceMetadata field-for-field with skill-named
// fields; the underlying data model is unchanged.
message SkillMetadata {
    string skill_doc_id = 1;
    string skill_doc_name = 2;
    string latest_version_update_by_user_id = 3;
    google.protobuf.Timestamp latest_version_last_updated_at = 4;
    bool never_published = 5;
    google.protobuf.Timestamp disabled_at = 6;
    string skill_file_id = 7;
    repeated string skill_associated_tag_ids = 8;
    string skill_doc_description = 9;
    bool should_always_use = 10;
    string skill_doc_content = 11;
    bool has_unpublished_edits = 12;
    // Folder the skill lives in. Unset means the skill lives at the root.
    optional string folder_id = 13;
    // The copy-invariant scoped ID of the skill (e.g. "gd_...").
    string scoped_id = 14;
    // Discriminates help-desk vs catalyst skills. See GuidanceMetadata.skill_type.
    SkillType skill_type = 15;
    string created_by_user_id = 16;
    string latest_version_updated_by_user_id = 17;
    serval.resources.v1.agentchannels.AgentChannelFilter channel_filter = 18;
}

enum GroupMatchType {
    GROUP_MATCH_TYPE_ANY = 0;
    GROUP_MATCH_TYPE_ALL = 1;
}

enum AccessProfileUnmatchAction {
    ACCESS_PROFILE_UNMATCH_ACTION_REVOKE = 0;
    // Drop the profile's pointer and leave the grant as observed access.
    ACCESS_PROFILE_UNMATCH_ACTION_KEEP = 1;
}

message AccessProfile {
    string id = 1;
    string team_id = 2;
    string name = 3;
    string description = 4;
    google.protobuf.Timestamp created_at = 5;
    GroupMatchType group_match_type = 6;
    optional AccessProfileExternalSource external_source = 7;
    bool is_team_default = 8;
    AccessProfileBuiltinProfileType builtin_profile_type = 9;
    reserved 10;
    bool birthright_enabled = 14;
    GroupMatchType birthright_group_match_type = 15;
    AccessProfileUnmatchAction unmatch_action = 11;
    reserved 12, 13;
    reserved "held_revokes", "held_since";
}

enum AccessProfileExceptionReason {
    ACCESS_PROFILE_EXCEPTION_REASON_UNSPECIFIED = 0;
    ACCESS_PROFILE_EXCEPTION_REASON_REVIEW = 1;
    ACCESS_PROFILE_EXCEPTION_REASON_ADMIN = 2;
}

// A grant the birthright reconciler must not restore. Keyed on the grant
// (user, entitlement) so no profile re-provisions it; a profile's Exceptions
// tab lists the ones on the entitlements it grants.
message AccessProfileException {
    string id = 1;
    string user_id = 2;
    string entitlement_id = 3;
    AccessProfileExceptionReason reason = 4;
    // Absent when a review remediation wrote the exception.
    optional string created_by_user_id = 5;
    google.protobuf.Timestamp created_at = 6;
}

message AccessProfileExternalSource {
    string app_instance_id = 1;
    string service_slug = 2;
    string external_id = 3;
    string external_name = 4;
}

message AccessProfileEntitlement {
    string id = 1;
    string access_profile_id = 2;
    string entitlement_id = 3;
    Entitlement entitlement = 4;
    bool is_tracking_team_default = 5;
}

// AccessProfileBuiltinProfileType marks access profiles that ship with the
// product (built-in) rather than being user-created. Built-in profiles have
// locked identity/criteria but editable grants.
enum AccessProfileBuiltinProfileType {
    ACCESS_PROFILE_BUILTIN_PROFILE_TYPE_UNSPECIFIED = 0;
    ACCESS_PROFILE_BUILTIN_PROFILE_TYPE_TEAM_MEMBERS = 1;
}

message AccessProfileGroup {
    string id = 1;
    string access_profile_id = 2;
    string group_id = 3;
    bool is_excluded = 4;
    reserved 5, 6;
}

message AccessProfileTeamRoles {
    string id = 1;
    string access_profile_id = 2;
    // Built-in team roles. Together with custom_role_ids: both empty means
    // any role on the team matches; otherwise a member matches by holding
    // any listed built-in role OR any listed custom role.
    repeated svauth.models.TeamRole team_roles = 3;
    // svauth custom-role IDs (user-defined roles from team settings).
    repeated string custom_role_ids = 4;
}

// AccessProfileAttributeCriterion matches displayed user-profile values. Custom
// fields use their svstore key; svauth built-ins use the reserved prefix. Enum
// and multiselect values are display names, not option IDs.
message AccessProfileAttributeCriterion {
    string id = 1;
    string access_profile_id = 2;
    string attribute_key = 3;
    repeated string match_values = 4;
    // "is none of": the row holds when the user has none of match_values.
    bool is_excluded = 5;
    // Rows sharing a condition group must all hold; groups OR together.
    int32 condition_group = 6;
}

message AccessProfileWorkflow {
    string id = 1;
    string access_profile_id = 2;
    string workflow_id = 3;
    string workflow_name = 4;
    string workflow_description = 5;
}

// A form whose audience this access profile is part of. Unlike the workflow
// twin, the name comes from the form's LATEST version rather than its deployed
// one: a form is gateable from its first draft save, so a never-published form
// must still render with a name.
message AccessProfileForm {
    string id = 1;
    string access_profile_id = 2;
    string form_id = 3;
    string form_name = 4;
    string form_description = 5;
}

// A skill (help-desk runbook) whose audience this access profile is part of.
// Like the form twin this restricts rather than grants: a skill with no
// profiles linked can be loaded into the agent's context for anyone in the
// org, and each linked profile narrows who that is. The name comes from the
// skill's LATEST version, so a never-published draft still renders with one.
message AccessProfileSkill {
    string id = 1;
    string access_profile_id = 2;
    string skill_id = 3;
    string skill_name = 4;
    string skill_description = 5;
}

// A knowledge base a profile grants its members access to. knowledge_base_id is
// the base root's knowledge_items.id (the public KB id from ListKnowledgeBases).
// Mirrors AccessProfileWorkflow.
message AccessProfileKnowledgeBase {
    string id = 1;
    string access_profile_id = 2;
    string knowledge_base_id = 3;
    string knowledge_base_name = 4;
    string knowledge_base_icon = 5;
}

message Tag {
    string id = 1;
    google.protobuf.Timestamp created_at = 2;
    optional google.protobuf.Timestamp deleted_at = 3;
    string name = 4;
    optional string color = 5;
    optional string icon_slug = 6;
    string description = 7;
}

// TagSubjectType is the kind of entity a tag is attached to. Mirrors the DB
// tag_subject_type enum and keys the polymorphic tag-subject RPCs that replace
// the per-subject tag-attach RPCs.
//
// Deliberately distinct from AccessRelationshipSubjectType: the two overlap
// but diverge (tags add workflow/guidance; owners add team) and back separate
// DB enums. Unifying them would trade enum type-safety for runtime subset
// validation.
enum TagSubjectType {
    TAG_SUBJECT_TYPE_UNSPECIFIED = 0;
    TAG_SUBJECT_TYPE_WORKFLOW = 1;
    TAG_SUBJECT_TYPE_GUIDANCE = 2;
    TAG_SUBJECT_TYPE_APP_INSTANCE = 3;
    TAG_SUBJECT_TYPE_RESOURCE = 4;
    TAG_SUBJECT_TYPE_ENTITLEMENT = 5;
    // Forms are file-backed like workflow/guidance: subject_id is the form's
    // FILE id on the user surface (the public surface accepts the form
    // definition id and translates).
    TAG_SUBJECT_TYPE_FORM = 6;
    // Form Blocks use their own subject kind so a Block and a Form can never
    // share associations accidentally. subject_id is the backing file id.
    TAG_SUBJECT_TYPE_FORM_BLOCK = 7;
}

// SubjectTags is one subject's resolved tag set, for batch list responses.
message SubjectTags {
    string subject_id = 1;
    repeated Tag tags = 2;
}

// Which surface a folder belongs to. Folders are scoped per folder_type so the
// Workflows, Skills, and Forms surfaces never see each other's folders.
// GUIDANCE folders hold guidance docs (a.k.a. Skills).
enum FolderType {
    FOLDER_TYPE_UNSPECIFIED = 0;
    FOLDER_TYPE_WORKFLOW = 1;
    FOLDER_TYPE_GUIDANCE = 2;
    FOLDER_TYPE_FORM = 3;
    FOLDER_TYPE_FORM_BLOCK = 4;
}

message Folder {
    string id = 1;
    google.protobuf.Timestamp created_at = 2;
    google.protobuf.Timestamp updated_at = 3;
    string team_id = 4;
    string name = 5;
    // Unset when the folder is at the root of the team's folder tree.
    optional string parent_folder_id = 6;
    string created_by_user_id = 7;
    FolderType folder_type = 8;
    // Copy-invariant team-scoped identity. Use this instead of id in portable
    // configuration; id remains the deployment-local database key.
    string scoped_id = 9;
}

// A personal saved view of the workflow list. `data` is an opaque
// frontend-owned JSON string (filters, sort, columns); the backend stores it
// without interpreting it beyond well-formedness.
message WorkflowView {
    string id = 1;
    string name = 2;
    string data = 3;
    google.protobuf.Timestamp created_at = 4;
    string created_by_user_id = 5;
    int32 display_order = 6;
    // The team the view was saved in. View data embeds team-scoped ids
    // (tags, app instances), so a view is only meaningful within its team.
    string team_id = 7;
}

message KnowledgeIngestionConfig {
    string id = 1;
    reserved 2; reserved "app_instance_id"; // custom ingestion has no app association
    string team_id = 3; // Derived from knowledge_sources.team_id
    string knowledge_source_id = 4;
    string workflow_id = 5;
    reserved 6; // was service_name (now derived from app_instances.service)
    reserved 7; // was enabled (soft delete replaces disable)
    reserved 8; // was sync_interval_minutes (no longer customer-configurable)
    google.protobuf.Timestamp last_sync_started_at = 9; // Derived from latest knowledge_sync_results
    google.protobuf.Timestamp last_sync_completed_at = 10; // Derived from latest knowledge_sync_results
    bool last_sync_succeeded = 11; // Derived from latest knowledge_sync_results
    optional string last_sync_error = 12; // Derived from latest knowledge_sync_results
    bool searching_enabled = 13;
    bool cite_urls = 14;
    google.protobuf.Timestamp created_at = 15;
    google.protobuf.Timestamp updated_at = 16;
    reserved 17; // was delete_missing_data (always true)
    // Display name of the source, mirrored from its native knowledge base's
    // name. Editable; defaults to the ingestion workflow's name.
    string name = 18;
    // Whether the mirror knowledge base is AI-context only (indexed for
    // retrieval but hidden from human-facing surfaces). Editable after creation.
    bool ai_context_only = 19;
    // Optional Brandfetch domain (bare hostname, e.g. "apple.com") for the
    // source's logo. Empty = no custom logo. Canonical home for the logo; the
    // manage-sources card and knowledge-item rows read it.
    string logo_brand_domain = 20;
}

// WorkflowBuilderThread represents a conversation thread from the workflow builder.
// Shared between the user and private APIs. Field numbers match the original
// user proto Thread types for wire compatibility.
message WorkflowBuilderThread {
    string id = 1;
    string workflow_id = 2;
    bool ai_in_progress = 3;
    repeated WorkflowBuilderThreadPart parts = 4;
    bool has_error = 5;
    repeated WorkflowBuilderThreadPendingMessage pending_messages = 6;
}

message WorkflowBuilderThreadPendingMessage {
    string id = 1;
    string thread_id = 2;
    string author_id = 3;
    string content = 4;
    google.protobuf.Timestamp created_at = 5;
    bool send_requested = 6;
}

message WorkflowBuilderThreadPart {
    string id = 1;
    string role = 2;
    string author_id = 3;
    oneof type {
        WorkflowBuilderThreadRunRequestMessage workflow_run_request = 4;
        WorkflowBuilderThreadMessage std_message = 5;
        WorkflowBuilderThreadWebSearchResults web_search_results = 6;
    }
    google.protobuf.Timestamp created_at = 7;
    optional google.protobuf.Timestamp finalized_at = 8;
}

message WorkflowBuilderThreadRunRequestMessage {}

message WorkflowBuilderThreadWebSearchResults {
    repeated WorkflowBuilderThreadWebSearchResult results = 1;
}

message WorkflowBuilderThreadWebSearchResult {
    string id = 1;
    string title = 2;
    string url = 3;
}

message WorkflowBuilderThreadMessage {
    string id = 1;
    string content = 2;
    bool generation_finished = 3;
    repeated WorkflowBuilderThreadFunctionCallWithEvaluations function_calls_with_evals = 4;
    WorkflowBuilderThreadWebSearchResults web_search_results = 5;
    google.protobuf.Timestamp created_at = 6;
    optional google.protobuf.Timestamp finalized_at = 7;
}

message WorkflowBuilderThreadFunctionCallWithEvaluations {
    WorkflowBuilderThreadFunctionCall function_call = 1;
    repeated WorkflowBuilderThreadEvaluation evaluations = 2;
    optional WorkflowRunMeta linked_workflow_run_meta = 3;
    optional WorkflowBuilderThreadCreatedTemporaryWorkflow created_temporary_workflow = 4;
}

message WorkflowBuilderThreadCreatedTemporaryWorkflow {
    string id = 1;
    string name = 2;
    bool is_finished_iterating = 3;
}

message WorkflowBuilderThreadFunctionCall {
    string id = 1;
    string name = 2;
    bool generation_finished = 3;
    google.protobuf.Timestamp created_at = 4;
    optional google.protobuf.Timestamp finished_at = 5;
}

enum WorkflowBuilderThreadEvaluationType {
    WORKFLOW_BUILDER_THREAD_EVALUATION_TYPE_UNSPECIFIED = 0;
    WORKFLOW_BUILDER_THREAD_TYPECHECK = 1;
    WORKFLOW_BUILDER_THREAD_LLM_REVIEW = 2;
}

enum WorkflowBuilderThreadEvaluationResultType {
    WORKFLOW_BUILDER_THREAD_EVALUATION_RESULT_TYPE_UNSPECIFIED = 0;
    WORKFLOW_BUILDER_THREAD_OK = 1;
    WORKFLOW_BUILDER_THREAD_ERROR = 2;
}

message WorkflowBuilderThreadEvaluation {
    string id = 1;
    WorkflowBuilderThreadEvaluationType type = 2;
    string result = 3;
    optional WorkflowBuilderThreadEvaluationResultType result_type = 4;
}

// AccessGrantRemediation is svflow's view of a UAR remediation row, used by
// svhelp's GetTicket enrichment + dashboard list view to surface live deprov
// state without coupling to svflow's DB schema.
message AccessGrantRemediation {
  string ticket_id = 1;
  string entitlement_id = 2;
  string user_id = 3;
  optional google.protobuf.Timestamp deprovision_run_started_at = 4;
  optional google.protobuf.Timestamp concluded_at = 5;
  // conclusion_reason is the access_request_conclusion_reason enum string
  // (e.g. "revoked", "deprovision-failed"). Set only when concluded_at is set.
  optional string conclusion_reason = 6;
  // What asked for the deprovision, as the access_grant_remediation_source
  // enum string: "access_review", "reclamation" or "revoke" (an ad-hoc revoke
  // from the roster). Unset on rows older than the column.
  optional string source = 7;
}

// =============================================================================
// Native Knowledge Base (svflow-owned Outline-like wiki). Distinct from
// the external KnowledgeSource / KnowledgeItem messages above which model
// the third-party ingestion pipeline.
// =============================================================================

// KnowledgeBase is the top-level container (Outline-style "Collection").
// Bases live per-team. content_json is schema-versioned editor JSON
// (v2: BlockNote blocks) and content_markdown is the derived text
// view for search/export.
message KnowledgeBase {
    string id = 1;
    string team_id = 2;
    string url_id = 3;
    string name = 4;
    string description = 5;
    optional string icon = 6;
    optional string color = 7;
    string sort_index = 8;
    bool commenting_enabled = 9;
    reserved 10; reserved "content_schema_version";
    reserved 11; reserved "editor_version";
    reserved 12; reserved "content_json";
    reserved 13; reserved "content_markdown";
    string created_by_user_id = 14;
    string last_modified_by_user_id = 15;
    optional google.protobuf.Timestamp archived_at = 16;
    optional string archived_by_user_id = 17;
    google.protobuf.Timestamp created_at = 18;
    google.protobuf.Timestamp updated_at = 19;
    // 20 was source_knowledge_item_id — the legacy native-mirror back-pointer,
    // retired with the mirror model. Reserved so the number/name never reuse.
    reserved 20;
    reserved "source_knowledge_item_id";
    // Set when this base is the native mirror of a custom knowledge
    // ingestion config. Like source_knowledge_item_id, its presence marks
    // the base as sync-managed (its documents are read-only), so the
    // frontend groups it under "External Connections" too.
    optional string source_ingestion_config_id = 21;
    // When true, this base is AI-context only: indexed for agent retrieval
    // but hidden from human-facing surfaces. The frontend groups it under a
    // separate "AI Context" section, collapses document bodies behind a
    // warning, and excludes it from the service catalog.
    bool ai_context_only = 22;
    // True when this base is a hand-authored native base
    // (knowledge_items.type = 'native_base'); false when it is an external
    // connector container promoted in place (e.g. a Confluence space or
    // ServiceNow knowledge base). The frontend groups non-native bases under
    // "External Connections". A config-mirror base is native but still external
    // (see source_ingestion_config_id).
    bool is_native_base = 23;
    // Server-computed: true when this base's PERMISSIONS are synced from its
    // connector (the base-root twin of KnowledgeDocument.permissions_sync_locked).
    // Its access-profile gating is read-only in Serval, so
    // AddKnowledgeBasesToAccessProfile refuses it and the access-profile picker
    // does not offer it.
    bool permissions_sync_locked = 24;
}

// One cross-team grant on a knowledge base. Exactly one target is set: a named
// team, or the owner's whole organization.
message KnowledgeBaseShare {
    string id = 1;
    string knowledge_base_id = 2;
    optional string target_team_id = 3;
    optional string target_organization_id = 4;
    string shared_by_user_id = 5;
    google.protobuf.Timestamp created_at = 6;
}

// A knowledge base another team shared with the reader's team. Deliberately not
// a KnowledgeBase: the reader gets identity and provenance, never the owner's
// editing state, because a share grants no write of any kind.
message SharedKnowledgeBase {
    string id = 1;
    string name = 2;
    optional string icon = 3;
    optional string color = 4;
    optional string url_id = 5;
    string owner_team_id = 6;
    google.protobuf.Timestamp shared_at = 7;
    // True when the reader sees this base through an organization-wide grant
    // rather than one aimed at its team. The frontend labels the two
    // differently, and only the owner can tell them apart otherwise.
    bool shared_org_wide = 8;
}

message KnowledgeDocumentBlock {
    string id = 1;
    string document_id = 2;
    reserved 3; reserved "client_block_id";
    reserved 4; reserved "parent_client_block_id";
    string block_type = 5;
    string props_json = 6;
    string content_json = 7;
    string plain_text = 8;
    string sort_index = 9;
    repeated KnowledgeDocumentBlock children = 10;
    google.protobuf.Timestamp created_at = 11;
    google.protobuf.Timestamp updated_at = 12;
    optional string parent_block_id = 13;
}

message KnowledgeDocumentBlockWrite {
    reserved 1; reserved "client_block_id";
    reserved 2; reserved "parent_client_block_id";
    string block_type = 3;
    string props_json = 4;
    string content_json = 5;
    string plain_text = 6;
    string sort_index = 7;
    repeated KnowledgeDocumentBlockWrite children = 8;
    string id = 9;
}

// KnowledgeDocument is the canonical (live) document row. The body source of
// truth is the blocks field; content_json/content_markdown are materialized
// projections retained for export/search/debug paths.
// KnowledgeDocumentKind separates content-bearing pages from pure
// organizational folders in the workspace tree. Folders mirror the
// Notion / Outline pattern: they hold no body content, only children.
enum KnowledgeDocumentKind {
    KNOWLEDGE_DOCUMENT_KIND_UNSPECIFIED = 0;
    KNOWLEDGE_DOCUMENT_KIND_PAGE = 1;
    KNOWLEDGE_DOCUMENT_KIND_FOLDER = 2;
}

message KnowledgeDocument {
    string id = 1;
    string team_id = 2;
    string knowledge_base_id = 3;
    optional string parent_document_id = 4;
    string url_id = 5;
    string title = 6;
    string summary = 7;
    optional string icon = 8;
    optional string color = 9;
    reserved 10; reserved "language";
    string sort_index = 11;
    reserved 12; reserved "content_schema_version";
    reserved 13; reserved "editor_version";
    reserved 14; reserved "content_json";
    reserved 15; reserved "content_markdown";
    int64 current_version_number = 16;
    // Publish model. published_version_number is unset until the doc has been
    // published at least once. Readers/agent see the published version;
    // editors edit the draft (current_version_number).
    optional google.protobuf.Timestamp published_at = 17;
    optional int64 published_version_number = 28;
    optional string published_by_user_id = 29;
    // True when there is an unpublished draft (current_version_number is ahead
    // of the published version, or the doc has never been published).
    bool has_unpublished_changes = 30;
    // Agent-retrieval indexing status of the published version.
    KnowledgeIndexStatus index_status = 31;
    optional google.protobuf.Timestamp archived_at = 18;
    optional string archived_by_user_id = 19;
    string created_by_user_id = 20;
    string last_modified_by_user_id = 21;
    google.protobuf.Timestamp created_at = 22;
    google.protobuf.Timestamp updated_at = 23;
    repeated KnowledgeDocumentBlock blocks = 24;
    KnowledgeDocumentKind kind = 25;
    // 26 was source_knowledge_item_id (legacy native-mirror back-pointer, retired).
    reserved 26;
    reserved "source_knowledge_item_id";
    // Server-computed from IsDocumentSyncLocked — true only while the
    // source still has import enabled and has not cut over.
    bool sync_locked = 27;
    // Server-computed: true when this item's PERMISSIONS are synced from its
    // source (external connector source with permissions_sync_enabled). The
    // connector is the source of truth for such an item's audience, so its
    // access-profile gating is READ-ONLY in Serval — the Visibility/Share
    // control is hidden. Narrower than sync_locked (which is content-lock): a
    // hand-authored native page under a connector-managed base is content-locked
    // but NOT permission-synced, so it stays manually gatable.
    bool permissions_sync_locked = 32;
    // Human-readable page number, unique inside the owning team's native
    // knowledge. Clients show it as "KB" plus seven zero-padded digits
    // (KB0000042). Set only on native pages; unset on folders and on items
    // that a connector syncs.
    optional int64 page_number = 33;
}

// Agent-retrieval indexing lifecycle for a published native document.
// Mirrors knowledge_documents.index_status.
enum KnowledgeIndexStatus {
    KNOWLEDGE_INDEX_STATUS_UNSPECIFIED = 0;
    // Not yet indexed (never published, or unpublished/archived).
    KNOWLEDGE_INDEX_STATUS_UNINDEXED = 1;
    // Indexing workflow in flight (chunking + embedding).
    KNOWLEDGE_INDEX_STATUS_INDEXING = 2;
    // Published version is chunked, embedded, and agent-retrievable.
    KNOWLEDGE_INDEX_STATUS_INDEXED = 3;
    // Indexing failed; retriable.
    KNOWLEDGE_INDEX_STATUS_FAILED = 4;
}

// KnowledgeDocumentSummary is a lightweight projection used in tree /
// list reads — drops content_json/content_markdown.
message KnowledgeDocumentSummary {
    string id = 1;
    string team_id = 2;
    string knowledge_base_id = 3;
    optional string parent_document_id = 4;
    string url_id = 5;
    string title = 6;
    string summary = 7;
    optional string icon = 8;
    optional string color = 9;
    string sort_index = 10;
    int64 current_version_number = 11;
    optional google.protobuf.Timestamp published_at = 12;
    optional google.protobuf.Timestamp archived_at = 13;
    string created_by_user_id = 14;
    string last_modified_by_user_id = 15;
    google.protobuf.Timestamp created_at = 16;
    google.protobuf.Timestamp updated_at = 17;
    KnowledgeDocumentKind kind = 18;
    // 19 was source_knowledge_item_id (legacy native-mirror back-pointer, retired).
    reserved 19;
    reserved "source_knowledge_item_id";
    bool sync_locked = 20;
    optional int64 published_version_number = 21;
    bool has_unpublished_changes = 22;
    KnowledgeIndexStatus index_status = 23;
    // See KnowledgeDocument.page_number.
    optional int64 page_number = 24;
}

message KnowledgeDocumentVersion {
    string id = 1;
    string document_id = 2;
    int64 version_number = 3;
    reserved 4; reserved "base_version_id";
    reserved 5; reserved "name";
    string title = 6;
    optional string icon = 7;
    optional string color = 8;
    reserved 9; reserved "content_schema_version";
    reserved 10; reserved "editor_version";
    reserved 11; reserved "content_json";
    reserved 12; reserved "content_markdown";
    string created_by_user_id = 13;
    reserved 14; reserved "collaborator_user_ids";
    google.protobuf.Timestamp created_at = 15;
    reserved 16; reserved "blocks";
    string summary = 17;
    string blocks_snapshot = 18;
    string plain_text_snapshot = 19;
    // Where this revision sits in the review lifecycle. An approver approves a
    // revision, not a document, so the state lives here.
    KnowledgeDocumentVersionState state = 20;
    KnowledgeDocumentVersionOrigin origin = 21;
    // For a synced revision, the upstream edit time it reflects. Unset for a
    // revision a person published in Serval.
    optional google.protobuf.Timestamp source_updated_at = 22;
}

// How a revision stands relative to the article's live content. A revision is
// A PROPOSED change to an article is still a svmeta change set, and
// change_set_status owns pending / accepted / rejected / applying / applied /
// failed for the PROPOSAL. PENDING_APPROVAL and REJECTED below are a different
// question: not "is this redline any good" but "may this revision go live",
// and they exist only for a team that turned the publish gate on.
enum KnowledgeDocumentVersionState {
    KNOWLEDGE_DOCUMENT_VERSION_STATE_UNSPECIFIED = 0;
    // Live. This is what the agent answers from.
    KNOWLEDGE_DOCUMENT_VERSION_STATE_PUBLISHED = 1;
    // A newer revision replaced it.
    KNOWLEDGE_DOCUMENT_VERSION_STATE_SUPERSEDED = 2;
    // Withdrawn by an unpublish. No newer revision replaced it.
    KNOWLEDGE_DOCUMENT_VERSION_STATE_RETIRED = 3;
    // Published while the team's approval gate was on. The snapshot exists but
    // is NOT live: the publish pointer stayed on the previously published
    // revision, so readers and the agent still see approved content.
    KNOWLEDGE_DOCUMENT_VERSION_STATE_PENDING_APPROVAL = 4;
    // An approver refused it. Terminal — nothing revives a rejected revision;
    // the author edits the draft and publishes again, which mints a new one.
    KNOWLEDGE_DOCUMENT_VERSION_STATE_REJECTED = 5;
}

// Who produced a revision. A connector sync records the user who connected the
// application as the author, so the origin is what tells the two apart.
enum KnowledgeDocumentVersionOrigin {
    KNOWLEDGE_DOCUMENT_VERSION_ORIGIN_UNSPECIFIED = 0;
    // A person published it in Serval.
    KNOWLEDGE_DOCUMENT_VERSION_ORIGIN_NATIVE = 1;
    // A connector sync wrote it from an external system.
    KNOWLEDGE_DOCUMENT_VERSION_ORIGIN_SYNC = 2;
}

message KnowledgeStar {
    string id = 1;
    string user_id = 2;
    string team_id = 3;
    optional string knowledge_base_id = 4;
    optional string document_id = 5;
    string sort_index = 6;
    google.protobuf.Timestamp created_at = 7;
}

message KnowledgeDocumentPin {
    string id = 1;
    string team_id = 2;
    // Null knowledge_base_id means team-global pin.
    optional string knowledge_base_id = 3;
    string document_id = 4;
    string sort_index = 5;
    string created_by_user_id = 6;
    google.protobuf.Timestamp created_at = 7;
}

message KnowledgeDocumentView {
    string id = 1;
    string user_id = 2;
    string document_id = 3;
    string team_id = 4;
    int64 view_count = 5;
    google.protobuf.Timestamp last_viewed_at = 6;
    optional google.protobuf.Timestamp last_editing_at = 7;
}

message KnowledgeDocumentSearchHit {
    KnowledgeDocumentSummary document = 1;
    double rank = 2;
    optional string block_client_id = 3;
    optional string block_plain_text = 4;
}
message ApprovalReminderResult {
    google.protobuf.Timestamp reminded_at = 1;
    int32 recipient_count = 2;
    int32 queued_event_count = 3;
    int32 unconfirmed_event_count = 4;
}

message ConfirmationReminderResult {
    google.protobuf.Timestamp reminded_at = 1;
    int32 recipient_count = 2;
    int32 queued_event_count = 3;
    int32 unconfirmed_event_count = 4;
}

enum IntegrationAccessFindingKind {
    INTEGRATION_ACCESS_FINDING_KIND_UNSPECIFIED = 0;
    // The saved code names this restricted connection, but the version's
    // package does not link it, so runs cannot reach it.
    INTEGRATION_ACCESS_FINDING_KIND_RESTRICTED_NOT_LINKED = 1;
    // The version's package links this connection, but the saved code
    // never names its service.
    INTEGRATION_ACCESS_FINDING_KIND_LINKED_NOT_REFERENCED = 2;
}

// One disagreement between a saved workflow version's integration references
// and the connections its package links. Purely advisory: a save is
// never refused because of a finding, and an extractor that cannot parse the
// content yields none.
message IntegrationAccessFinding {
    IntegrationAccessFindingKind kind = 1;
    string app_instance_id = 2;
    string service = 3;
    string instance_name = 4;
}
