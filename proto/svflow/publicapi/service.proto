// Knowledge search requests and responses

message SearchKnowledgeRequest {
    // The ID of the workspace whose knowledge corpus to search.
    string team_id = 1 [(google.api.field_behavior) = REQUIRED];
    // The search query.
    string query = 2 [(google.api.field_behavior) = REQUIRED];
    // Optional. User emails for permission filtering. When provided, results
    // that enforce ingested permissions are filtered to chunks at least one of
    // these users can access.
    repeated string user_emails = 3;
    // Optional. Treat the request as coming from a public channel — affects
    // display mode for chunks marked public_channel_links_only.
    optional bool is_public_channel = 4;
    // Optional. Maximum number of result chunks to return, most relevant
    // first. Unset means no cap on the count — max_response_tokens alone
    // decides how many fit. Values above 200 are clamped.
    optional int32 max_results = 5;
    // Optional. Maximum characters of relevant_content per chunk. Unset means
    // no per-chunk cap. Set it to trade depth for coverage: shorter chunks
    // let more distinct documents fit inside the same token budget. Values
    // above 8000 are clamped to 8000, the ingestion chunk size.
    optional int32 max_content_chars = 6;
    // Optional. Token budget for the entire response. Defaults to 24000.
    // Values above 200000 are clamped to 200000, and values below 576 are
    // raised to 576 — the smallest budget that can return one chunk with
    // readable content, since a chunk's citation fields alone cost ~180
    // tokens on the wire. Values below 1 fall back to the default. Chunks are
    // added in relevance order until the budget is spent, so the response
    // always fits and always carries as much as it can.
    //
    // The default is sized to the tool-result limit an MCP client applies by
    // default (25000 tokens), because this endpoint's caller reads the whole
    // response as one tool result. A response over that limit is not merely
    // large — the client discards it, so the search returns nothing usable.
    // Raise this only if the client's limit is also raised.
    //
    // Tokens are counted with an Anthropic-calibrated counter that
    // deliberately overestimates, so the client's own count lands under the
    // number requested here.
    optional int32 max_response_tokens = 7;
}

message KnowledgeSearchResultItem {
    // ID of the source knowledge item.
    string id = 1;
    // The source knowledge item's display name.
    string name = 2;
    // The application URL for the source knowledge item, when the source is
    // configured to cite URLs. Empty otherwise.
    string application_url = 3;
    // The knowledge source (connector, custom ingestion, or native) this item
    // was indexed from. Matches KnowledgeBase.knowledge_source_id in
    // ListKnowledgeBases (include_external_sources), so a caller can look up
    // the source's name and sync status for any result.
    string knowledge_source_id = 4;
    // When the item last changed at its origin (a Slack thread's timestamp,
    // a page's last edit). Lets a caller see the time range its results
    // actually span instead of assuming the whole source.
    optional google.protobuf.Timestamp last_changed_at = 5;
}

// How a result chunk should be rendered to end users. Mirrors
// svflow.private.KnowledgeDisplayMode.
enum KnowledgeDisplayMode {
    KNOWLEDGE_DISPLAY_MODE_UNSPECIFIED = 0;
    KNOWLEDGE_DISPLAY_MODE_FULL = 1;
    KNOWLEDGE_DISPLAY_MODE_LINK_ONLY = 2;
    KNOWLEDGE_DISPLAY_MODE_HIDDEN = 3;
}

message KnowledgeSearchResultChunk {
    // Stable chunk ID.
    string id = 1;
    // The relevant content snippet.
    string relevant_content = 2;
    // The source knowledge item this chunk belongs to.
    KnowledgeSearchResultItem knowledge_item = 3;
    // Display mode determined by permission filtering.
    KnowledgeDisplayMode display_mode = 4;
    // True when the source enforces ingested permissions.
    bool has_permissions = 5;
    // Fused/reranked relevance score in [0, 1]. Not calibrated across queries.
    float similarity_score = 6;
    // True when relevant_content was cut, either by max_content_chars or by
    // the response token budget. The chunk's full text is not available
    // through this endpoint; follow knowledge_item.application_url for the
    // whole document.
    bool content_truncated = 7;
}

message SearchKnowledgeResponse {
    // Matching knowledge chunks, ordered by relevance.
    repeated KnowledgeSearchResultChunk data = 1;
    // How many chunks matched before max_results and the token budget were
    // applied.
    // A value greater than the length of data means the response is capped —
    // narrow the query to reach the rest.
    int32 total_results = 2;
    // The response's measured token cost, by the same counter that enforced
    // max_response_tokens. Never greater than max_response_tokens.
    int32 response_tokens = 3;
}

