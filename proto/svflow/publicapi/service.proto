    string workflow_id = 1 [(google.api.field_behavior) = REQUIRED];
    // Workflow arguments as a JSON object encoded into a string — NOT a raw
    // JSON object. Example: "{\"app\":\"Zoom\",\"dryRun\":true}". Omit (or pass
    // "{}") for no arguments. A value that is not valid JSON, or is valid JSON
    // but not an object, is rejected with INVALID_ARGUMENT.
    optional string arguments = 2;
    // Optional: a specific version of the workflow to run. The version must
    // belong to the workflow identified by workflow_id; it does not need to
    // be published. If omitted, the workflow's currently-published version is
    // used (and the call fails with INVALID_ARGUMENT if the workflow has no
    // published version).
    optional string workflow_version_id = 3;
    // Optional user ID the workflow runs on behalf of. If omitted, requests with
    // user context run on behalf of the authenticated user. Mutually exclusive
    // with for_user_email.
    optional string for_user_id = 4;
    // Optional email of the user the workflow runs on behalf of. The user must
    // belong to the workflow's workspace. Mutually exclusive with for_user_id.
    optional string for_user_email = 5;
}

message StartWorkflowRunResponse {
    // The workflow run, in its initial (pending/running) state.
    pubapimodels.WorkflowRun data = 1;
}

