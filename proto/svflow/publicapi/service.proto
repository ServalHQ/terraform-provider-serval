    repeated pubapimodels.ApprovalDelegate delegates = 2;
    // The priority of the delegation rule (lower values are higher priority).
    optional int32 priority = 3;
    // A description of the delegation rule.
    optional string description = 4;
    // When the delegation rule becomes active. Unset leaves the current value
    // unchanged; to remove the window, set clear_active_window.
    optional google.protobuf.Timestamp active_from = 5;
    // When the delegation rule stops applying (exclusive). Unset leaves the
