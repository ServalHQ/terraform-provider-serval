syntax = "proto3";

package svflow.publicapi;

import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "serval/resources/v1/agentchannels/channels.proto";
import "svflow/common/models.proto";
import "svflow/pubapimodels/changesets.proto";
import "svflow/pubapimodels/models.proto";
import public "svflow/publicapi/changesets.proto";
import "svrunstate/models/models.proto";

service SvFlowPublicAPIService {
    // Access Policy Management
    rpc GetAccessPolicy (GetAccessPolicyRequest) returns (GetAccessPolicyResponse);
    rpc CreateAccessPolicy (CreateAccessPolicyRequest) returns (CreateAccessPolicyResponse);
    rpc UpdateAccessPolicy (UpdateAccessPolicyRequest) returns (UpdateAccessPolicyResponse);
    rpc DeleteAccessPolicy (DeleteAccessPolicyRequest) returns (DeleteAccessPolicyResponse);
    rpc ListAccessPolicies (ListAccessPoliciesRequest) returns (ListAccessPoliciesResponse);

    // Access Policy Approval Procedure Management
    rpc GetAccessPolicyApprovalProcedure (GetAccessPolicyApprovalProcedureRequest) returns (GetAccessPolicyApprovalProcedureResponse);
    rpc CreateAccessPolicyApprovalProcedure (CreateAccessPolicyApprovalProcedureRequest) returns (CreateAccessPolicyApprovalProcedureResponse);
    rpc UpdateAccessPolicyApprovalProcedure (UpdateAccessPolicyApprovalProcedureRequest) returns (UpdateAccessPolicyApprovalProcedureResponse);
    rpc DeleteAccessPolicyApprovalProcedure (DeleteAccessPolicyApprovalProcedureRequest) returns (DeleteAccessPolicyApprovalProcedureResponse);
    rpc ListAccessPolicyApprovalProcedures (ListAccessPolicyApprovalProceduresRequest) returns (ListAccessPolicyApprovalProceduresResponse);

    // Workflow Management
    rpc GetWorkflow (GetWorkflowRequest) returns (GetWorkflowResponse);
    rpc CreateWorkflow (CreateWorkflowRequest) returns (CreateWorkflowResponse);
    rpc UpdateWorkflow (UpdateWorkflowRequest) returns (UpdateWorkflowResponse);
    rpc DeleteWorkflow (DeleteWorkflowRequest) returns (DeleteWorkflowResponse);
    rpc ListWorkflows (ListWorkflowsRequest) returns (ListWorkflowsResponse);
    rpc ListWorkflowVersions (ListWorkflowVersionsRequest) returns (ListWorkflowVersionsResponse);
    rpc TriggerWorkflowByWebhook (TriggerWorkflowByWebhookRequest) returns (TriggerWorkflowByWebhookResponse);
    rpc TriggerIngestionWebhook (TriggerIngestionWebhookRequest) returns (TriggerIngestionWebhookResponse);

    // Scoped ID Resolution
    rpc ResolveScopedRefs (ResolveScopedRefsRequest) returns (ResolveScopedRefsResponse);

    // Tag Management
    rpc GetTag (GetTagRequest) returns (GetTagResponse);
    rpc CreateTag (CreateTagRequest) returns (CreateTagResponse);
    rpc UpdateTag (UpdateTagRequest) returns (UpdateTagResponse);
    rpc DeleteTag (DeleteTagRequest) returns (DeleteTagResponse);
    rpc ListTags (ListTagsRequest) returns (ListTagsResponse);

    // Polymorphic tag attach across all subject types (resource, role,
    // app_instance, workflow, guidance). Replaces the per-subject attach RPCs.
    rpc AddTagToSubject (AddTagToSubjectRequest) returns (AddTagToSubjectResponse);
    rpc RemoveTagFromSubject (RemoveTagFromSubjectRequest) returns (RemoveTagFromSubjectResponse);
    rpc ListSubjectTags (ListSubjectTagsRequest) returns (ListSubjectTagsResponse);

    // Workflow Approval Procedure Management
    rpc GetWorkflowApprovalProcedure (GetWorkflowApprovalProcedureRequest) returns (GetWorkflowApprovalProcedureResponse);
    rpc CreateWorkflowApprovalProcedure (CreateWorkflowApprovalProcedureRequest) returns (CreateWorkflowApprovalProcedureResponse);
    rpc UpdateWorkflowApprovalProcedure (UpdateWorkflowApprovalProcedureRequest) returns (UpdateWorkflowApprovalProcedureResponse);
    rpc DeleteWorkflowApprovalProcedure (DeleteWorkflowApprovalProcedureRequest) returns (DeleteWorkflowApprovalProcedureResponse);
    rpc ListWorkflowApprovalProcedures (ListWorkflowApprovalProceduresRequest) returns (ListWorkflowApprovalProceduresResponse);
    rpc ListTeamWorkflowApprovalProcedures (ListTeamWorkflowApprovalProceduresRequest) returns (ListTeamWorkflowApprovalProceduresResponse);
    rpc ListTeamAccessPolicyApprovalProcedures (ListTeamAccessPolicyApprovalProceduresRequest) returns (ListTeamAccessPolicyApprovalProceduresResponse);

    // Approval Procedure Management (named, workspace-scoped library
    // procedures with no parent workflow or access policy)
    rpc CreateApprovalProcedure (CreateApprovalProcedureRequest) returns (CreateApprovalProcedureResponse);
    rpc GetApprovalProcedure (GetApprovalProcedureRequest) returns (GetApprovalProcedureResponse);
    rpc ListApprovalProcedures (ListApprovalProceduresRequest) returns (ListApprovalProceduresResponse);
    rpc UpdateApprovalProcedure (UpdateApprovalProcedureRequest) returns (UpdateApprovalProcedureResponse);
    rpc DeleteApprovalProcedure (DeleteApprovalProcedureRequest) returns (DeleteApprovalProcedureResponse);
    rpc ListLegacyApprovalMigrationFailures (ListLegacyApprovalMigrationFailuresRequest) returns (ListLegacyApprovalMigrationFailuresResponse);

    // Role sync. Not documented: shapes may change while Catalyst is its only
    // writer.
    rpc CreateRoleSync (CreateRoleSyncRequest) returns (CreateRoleSyncResponse);
    rpc UpdateRoleSync (UpdateRoleSyncRequest) returns (UpdateRoleSyncResponse);
    rpc GetRoleSync (GetRoleSyncRequest) returns (GetRoleSyncResponse);
    rpc ListRoleSyncs (ListRoleSyncsRequest) returns (ListRoleSyncsResponse);
    rpc RunRoleSync (RunRoleSyncRequest) returns (RunRoleSyncResponse);
    rpc AwaitRoleSyncRun (AwaitRoleSyncRunRequest) returns (AwaitRoleSyncRunResponse);
    rpc GetAppAccountFields (GetAppAccountFieldsRequest) returns (GetAppAccountFieldsResponse);
    rpc UpdateAppAccountFields (UpdateAppAccountFieldsRequest) returns (UpdateAppAccountFieldsResponse);

    // Folder Management
    rpc GetFolder (GetFolderRequest) returns (GetFolderResponse);
    rpc CreateFolder (CreateFolderRequest) returns (CreateFolderResponse);
    rpc UpdateFolder (UpdateFolderRequest) returns (UpdateFolderResponse);
    rpc DeleteFolder (DeleteFolderRequest) returns (DeleteFolderResponse);
    rpc ListFolders (ListFoldersRequest) returns (ListFoldersResponse);
    rpc ListFolderContents (ListFolderContentsRequest) returns (ListFolderContentsResponse);
    rpc SetFolderItemLocation (SetFolderItemLocationRequest) returns (SetFolderItemLocationResponse);

    // Guidance Management
    rpc GetGuidance (GetGuidanceRequest) returns (GetGuidanceResponse);
    rpc CreateGuidance (CreateGuidanceRequest) returns (CreateGuidanceResponse);
    rpc UpdateGuidance (UpdateGuidanceRequest) returns (UpdateGuidanceResponse);
    rpc DeleteGuidance (DeleteGuidanceRequest) returns (DeleteGuidanceResponse);
    rpc ListGuidances (ListGuidancesRequest) returns (ListGuidancesResponse);
    rpc ListGuidanceVersions (ListGuidanceVersionsRequest) returns (ListGuidanceVersionsResponse);

    // Skill Management. The Guidance RPCs above are permanent aliases of
    // these for existing API clients.
    rpc GetSkill (GetSkillRequest) returns (GetSkillResponse);
    rpc CreateSkill (CreateSkillRequest) returns (CreateSkillResponse);
    rpc UpdateSkill (UpdateSkillRequest) returns (UpdateSkillResponse);
    rpc DeleteSkill (DeleteSkillRequest) returns (DeleteSkillResponse);
    rpc ListSkills (ListSkillsRequest) returns (ListSkillsResponse);
    rpc ListSkillVersions (ListSkillVersionsRequest) returns (ListSkillVersionsResponse);

    // Form Management
    rpc GetForm (GetFormRequest) returns (GetFormResponse);
    rpc CreateForm (CreateFormRequest) returns (CreateFormResponse);
    rpc CreateFormImage (CreateFormImageRequest) returns (CreateFormImageResponse);
    rpc ListFormImages (ListFormImagesRequest) returns (ListFormImagesResponse);
    rpc UpdateForm (UpdateFormRequest) returns (UpdateFormResponse);
    rpc DeleteForm (DeleteFormRequest) returns (DeleteFormResponse);
    rpc ListForms (ListFormsRequest) returns (ListFormsResponse);
    rpc ListSubmittableForms (ListSubmittableFormsRequest) returns (ListSubmittableFormsResponse);

    // App Resource Management
    rpc GetAppResource (GetAppResourceRequest) returns (GetAppResourceResponse);
    rpc CreateAppResource (CreateAppResourceRequest) returns (CreateAppResourceResponse);
    rpc BatchCreateAppResources (BatchCreateAppResourcesRequest) returns (BatchCreateAppResourcesResponse);
    rpc UpdateAppResource (UpdateAppResourceRequest) returns (UpdateAppResourceResponse);
    rpc BatchUpdateAppResources (BatchUpdateAppResourcesRequest) returns (BatchUpdateAppResourcesResponse);
    rpc DeleteAppResource (DeleteAppResourceRequest) returns (DeleteAppResourceResponse);
    rpc SearchAppResources (SearchAppResourcesRequest) returns (SearchAppResourcesResponse);
    rpc ListAppResources (ListAppResourcesRequest) returns (ListAppResourcesResponse);
    rpc ListResourcesForAppInstance (ListResourcesForAppInstanceRequest) returns (ListResourcesForAppInstanceResponse);

    // App Resource Entitlement Management (deprecated - use Role endpoints)
    rpc GetAppResourceEntitlement (GetAppResourceEntitlementRequest) returns (GetAppResourceEntitlementResponse);
    rpc CreateAppResourceEntitlement (CreateAppResourceEntitlementRequest) returns (CreateAppResourceEntitlementResponse);
    rpc UpdateAppResourceEntitlement (UpdateAppResourceEntitlementRequest) returns (UpdateAppResourceEntitlementResponse);
    rpc BatchUpdateAppResourceEntitlements (BatchUpdateAppResourceEntitlementsRequest) returns (BatchUpdateAppResourceEntitlementsResponse);
    rpc DeleteAppResourceEntitlement (DeleteAppResourceEntitlementRequest) returns (DeleteAppResourceEntitlementResponse);
    rpc SearchAppResourceEntitlements (SearchAppResourceEntitlementsRequest) returns (SearchAppResourceEntitlementsResponse);
    rpc ListAppResourceEntitlements (ListAppResourceEntitlementsRequest) returns (ListAppResourceEntitlementsResponse);
    rpc ListEntitlementsForAppResource (ListEntitlementsForAppResourceRequest) returns (ListEntitlementsForAppResourceResponse);

    // App Resource Role Management
    rpc GetAppResourceRole (GetAppResourceRoleRequest) returns (GetAppResourceRoleResponse);
    rpc CreateAppResourceRole (CreateAppResourceRoleRequest) returns (CreateAppResourceRoleResponse);
    rpc UpdateAppResourceRole (UpdateAppResourceRoleRequest) returns (UpdateAppResourceRoleResponse);
    rpc BatchUpdateAppResourceRoles (BatchUpdateAppResourceRolesRequest) returns (BatchUpdateAppResourceRolesResponse);
    rpc DeleteAppResourceRole (DeleteAppResourceRoleRequest) returns (DeleteAppResourceRoleResponse);
    rpc SearchAppResourceRoles (SearchAppResourceRolesRequest) returns (SearchAppResourceRolesResponse);
    rpc ListAppResourceRoles (ListAppResourceRolesRequest) returns (ListAppResourceRolesResponse);

    // Workspace-level access request settings (defaults applied to new roles).
    rpc GetTeamAccessRequestSettings (GetTeamAccessRequestSettingsRequest) returns (GetTeamAccessRequestSettingsResponse);
    rpc UpdateTeamAccessRequestSettings (UpdateTeamAccessRequestSettingsRequest) returns (UpdateTeamAccessRequestSettingsResponse);

    // App Instance Management
    rpc GetAppInstance (GetAppInstanceRequest) returns (GetAppInstanceResponse);
    rpc CreateAppInstance (CreateAppInstanceRequest) returns (CreateAppInstanceResponse);
    rpc UpdateAppInstance (UpdateAppInstanceRequest) returns (UpdateAppInstanceResponse);
    rpc DeleteAppInstance (DeleteAppInstanceRequest) returns (DeleteAppInstanceResponse);
    rpc ListAppInstances (ListAppInstancesRequest) returns (ListAppInstancesResponse);
    rpc ListAppInstanceIntegrations (ListAppInstanceIntegrationsRequest) returns (ListAppInstanceIntegrationsResponse);
    // The workspace's worker replicas (Serval-managed and self-hosted) that
    // reported recently, with what each runs and its latest connectivity
    // checks. Read from svrunstate.
    rpc ListWorkerReplicas (ListWorkerReplicasRequest) returns (ListWorkerReplicasResponse);
    // Upstreams the workspace's worker replicas could not open, per app instance
    // and cause. Read from svrunstate.
    rpc ListWorkerEgressFailures (ListWorkerEgressFailuresRequest) returns (ListWorkerEgressFailuresResponse);
    // Runs waiting on the workspace's self-hosted queues, which only the workspace's
    // own workers can claim. The signal a customer-side autoscaler scales
    // self-hosted workers on. Read from svrunstate.
    rpc GetSelfHostedQueuePressure (GetSelfHostedQueuePressureRequest) returns (GetSelfHostedQueuePressureResponse);
    rpc GetAppInstanceHealthChecks (GetAppInstanceHealthChecksRequest) returns (GetAppInstanceHealthChecksResponse);
    // Returns the agent card captured by the last A2A discovery sync for an
    // app instance (NotFound until a sync has stored one).
    rpc GetAppInstanceAgentCard (GetAppInstanceAgentCardRequest) returns (GetAppInstanceAgentCardResponse);

    // App Instance Label Management — DEPRECATED. App instance labels are
    // unified into the polymorphic tag model; these shim onto the Tag /
    // tag-subject RPCs for backward compatibility. Use the Tag +
    // AddTagToSubject family instead.
    rpc ListAppInstanceLabels (ListAppInstanceLabelsRequest) returns (ListAppInstanceLabelsResponse) { option deprecated = true; }
    rpc CreateAppInstanceLabel (CreateAppInstanceLabelRequest) returns (CreateAppInstanceLabelResponse) { option deprecated = true; }
    rpc UpdateAppInstanceLabel (UpdateAppInstanceLabelRequest) returns (UpdateAppInstanceLabelResponse) { option deprecated = true; }
    rpc DeleteAppInstanceLabel (DeleteAppInstanceLabelRequest) returns (DeleteAppInstanceLabelResponse) { option deprecated = true; }
    rpc AddLabelToAppInstance (AddLabelToAppInstanceRequest) returns (AddLabelToAppInstanceResponse) { option deprecated = true; }
    rpc RemoveLabelFromAppInstance (RemoveLabelFromAppInstanceRequest) returns (RemoveLabelFromAppInstanceResponse) { option deprecated = true; }
    rpc BulkAddLabelToAppInstances (BulkAddLabelToAppInstancesRequest) returns (BulkAddLabelToAppInstancesResponse) { option deprecated = true; }
    rpc BulkRemoveLabelFromAppInstances (BulkRemoveLabelFromAppInstancesRequest) returns (BulkRemoveLabelFromAppInstancesResponse) { option deprecated = true; }

    // Access Relationship Management. Polymorphic over the subject the
    // relationship is on (app instance / resource / role (entitlement) / workspace).
    // Owner management is just relationship_type=OWNER — there is no separate
    // "owners" RPC family.
    rpc CreateAccessRelationship (CreateAccessRelationshipRequest) returns (CreateAccessRelationshipResponse);
    rpc GetAccessRelationship (GetAccessRelationshipRequest) returns (GetAccessRelationshipResponse);
    rpc UpdateAccessRelationship (UpdateAccessRelationshipRequest) returns (UpdateAccessRelationshipResponse);
    rpc DeleteAccessRelationship (DeleteAccessRelationshipRequest) returns (DeleteAccessRelationshipResponse);
    rpc ListAccessRelationships (ListAccessRelationshipsRequest) returns (ListAccessRelationshipsResponse);

    // DEPRECATED app-relationship RPCs — superseded by the AccessRelationship
    // family above; shim onto it for the app_instance subject, retained for
    // backward compatibility.
    rpc CreateAppRelationship (CreateAppRelationshipRequest) returns (CreateAppRelationshipResponse) { option deprecated = true; }
    rpc GetAppRelationship (GetAppRelationshipRequest) returns (GetAppRelationshipResponse) { option deprecated = true; }
    rpc UpdateAppRelationship (UpdateAppRelationshipRequest) returns (UpdateAppRelationshipResponse) { option deprecated = true; }
    rpc DeleteAppRelationship (DeleteAppRelationshipRequest) returns (DeleteAppRelationshipResponse) { option deprecated = true; }
    rpc ListAppRelationships (ListAppRelationshipsRequest) returns (ListAppRelationshipsResponse) { option deprecated = true; }

    // Custom Service Management
    rpc GetCustomService (GetCustomServiceRequest) returns (GetCustomServiceResponse);
    rpc CreateCustomService (CreateCustomServiceRequest) returns (CreateCustomServiceResponse);
    rpc UpdateCustomService (UpdateCustomServiceRequest) returns (UpdateCustomServiceResponse);
    rpc DeleteCustomService (DeleteCustomServiceRequest) returns (DeleteCustomServiceResponse);
    rpc ListCustomServices (ListCustomServicesRequest) returns (ListCustomServicesResponse);

    // Package Management
    rpc GetPackage (GetPackageRequest) returns (GetPackageResponse);
    rpc CreatePackage (CreatePackageRequest) returns (CreatePackageResponse);
    rpc UpdatePackage (UpdatePackageRequest) returns (UpdatePackageResponse);
    rpc DeletePackage (DeletePackageRequest) returns (DeletePackageResponse);
    rpc ListPackages (ListPackagesRequest) returns (ListPackagesResponse);

    // Workflow Run Management
    rpc StartWorkflowRun (StartWorkflowRunRequest) returns (StartWorkflowRunResponse);
    rpc AwaitWorkflowRunResult (AwaitWorkflowRunResultRequest) returns (AwaitWorkflowRunResultResponse);
    rpc GetWorkflowRun (GetWorkflowRunRequest) returns (GetWorkflowRunResponse);
    rpc ListWorkflowRuns (ListWorkflowRunsRequest) returns (ListWorkflowRunsResponse);
    rpc SearchWorkflowRuns (SearchWorkflowRunsRequest) returns (SearchWorkflowRunsResponse);
    rpc CountWorkflowRuns (CountWorkflowRunsRequest) returns (CountWorkflowRunsResponse);
    rpc ListWorkflowRunTasks (ListWorkflowRunTasksRequest) returns (ListWorkflowRunTasksResponse);
    rpc GetWorkflowRunTask (GetWorkflowRunTaskRequest) returns (GetWorkflowRunTaskResponse);

    // Access Request Management
    rpc CreateAccessRequest (CreateAccessRequestRequest) returns (CreateAccessRequestResponse);
    rpc GetAccessRequest (GetAccessRequestRequest) returns (GetAccessRequestResponse);
    rpc ListAccessRequests (ListAccessRequestsRequest) returns (ListAccessRequestsResponse);
    rpc SearchAccessMemberships (SearchAccessMembershipsRequest) returns (SearchAccessMembershipsResponse);
    rpc SearchAccessRequests (SearchAccessRequestsRequest) returns (SearchAccessRequestsResponse);
    rpc RevokeAccessRequest (RevokeAccessRequestRequest) returns (RevokeAccessRequestResponse);
    rpc ListRequestableRoles (ListRequestableRolesRequest) returns (ListRequestableRolesResponse);

    // Approval Request Management
    rpc ListApprovalRequests (ListApprovalRequestsRequest) returns (ListApprovalRequestsResponse);
    rpc SearchApprovalRequests (SearchApprovalRequestsRequest) returns (SearchApprovalRequestsResponse);
    rpc GetApprovalRequest (GetApprovalRequestRequest) returns (GetApprovalRequestResponse);

    // Approval Request Step Management
    rpc ListApprovalRequestSteps (ListApprovalRequestStepsRequest) returns (ListApprovalRequestStepsResponse);
    rpc GetApprovalRequestStep (GetApprovalRequestStepRequest) returns (GetApprovalRequestStepResponse);

    // Access Profile Management
    rpc CreateAccessProfile (CreateAccessProfileRequest) returns (CreateAccessProfileResponse);
    rpc GetAccessProfile (GetAccessProfileRequest) returns (GetAccessProfileResponse);
    rpc UpdateAccessProfile (UpdateAccessProfileRequest) returns (UpdateAccessProfileResponse);
    rpc DeleteAccessProfile (DeleteAccessProfileRequest) returns (DeleteAccessProfileResponse);
    rpc ListAccessProfiles (ListAccessProfilesRequest) returns (ListAccessProfilesResponse);

    // Access Profile Grant Management
    rpc CreateAccessProfileGrant (CreateAccessProfileGrantRequest) returns (CreateAccessProfileGrantResponse);
    rpc GetAccessProfileGrant (GetAccessProfileGrantRequest) returns (GetAccessProfileGrantResponse);
    rpc DeleteAccessProfileGrant (DeleteAccessProfileGrantRequest) returns (DeleteAccessProfileGrantResponse);
    rpc ListAccessProfileGrants (ListAccessProfileGrantsRequest) returns (ListAccessProfileGrantsResponse);

    // Approval Delegation Management
    rpc CreateApprovalDelegation (CreateApprovalDelegationRequest) returns (CreateApprovalDelegationResponse);
    rpc GetApprovalDelegation (GetApprovalDelegationRequest) returns (GetApprovalDelegationResponse);
    rpc UpdateApprovalDelegation (UpdateApprovalDelegationRequest) returns (UpdateApprovalDelegationResponse);
    rpc DeleteApprovalDelegation (DeleteApprovalDelegationRequest) returns (DeleteApprovalDelegationResponse);
    rpc ListApprovalDelegations (ListApprovalDelegationsRequest) returns (ListApprovalDelegationsResponse);

    // Knowledge search.
    rpc SearchKnowledge (SearchKnowledgeRequest) returns (SearchKnowledgeResponse);
    // Endpoint search over a workspace's uploaded custom-service API documentation.
    rpc SearchCustomServiceEndpoints (SearchCustomServiceEndpointsRequest) returns (SearchCustomServiceEndpointsResponse);
    rpc GetCustomServiceEndpoint (GetCustomServiceEndpointRequest) returns (GetCustomServiceEndpointResponse);

    // Native Knowledge Base Management
    rpc CreateKnowledgeBase (CreateKnowledgeBaseRequest) returns (CreateKnowledgeBaseResponse);
    rpc GetKnowledgeBase (GetKnowledgeBaseRequest) returns (GetKnowledgeBaseResponse);
    rpc ListKnowledgeBases (ListKnowledgeBasesRequest) returns (ListKnowledgeBasesResponse);
    rpc UpdateKnowledgeBase (UpdateKnowledgeBaseRequest) returns (UpdateKnowledgeBaseResponse);
    rpc DeleteKnowledgeBase (DeleteKnowledgeBaseRequest) returns (DeleteKnowledgeBaseResponse);

    // Native Knowledge Document Management
    rpc CreateKnowledgeDocument (CreateKnowledgeDocumentRequest) returns (CreateKnowledgeDocumentResponse);
    rpc GetKnowledgeDocument (GetKnowledgeDocumentRequest) returns (GetKnowledgeDocumentResponse);
    rpc ListKnowledgeDocuments (ListKnowledgeDocumentsRequest) returns (ListKnowledgeDocumentsResponse);
    rpc UpdateKnowledgeDocument (UpdateKnowledgeDocumentRequest) returns (UpdateKnowledgeDocumentResponse);
    rpc MoveKnowledgeDocument (MoveKnowledgeDocumentRequest) returns (MoveKnowledgeDocumentResponse);
    rpc DeleteKnowledgeDocument (DeleteKnowledgeDocumentRequest) returns (DeleteKnowledgeDocumentResponse);
    rpc PublishKnowledgeDocument (PublishKnowledgeDocumentRequest) returns (PublishKnowledgeDocumentResponse);
    rpc UnpublishKnowledgeDocument (UnpublishKnowledgeDocumentRequest) returns (UnpublishKnowledgeDocumentResponse);

    // Custom Knowledge Ingestion — connect a published ingestion workflow as a
    // custom knowledge source (auto-provisions the read-only mirror base).
    rpc CreateKnowledgeIngestionConfig (CreateKnowledgeIngestionConfigRequest) returns (CreateKnowledgeIngestionConfigResponse);
}

// Requests / Responses

// Sets up a custom knowledge ingestion: connects a published knowledge ingestion
// workflow as a custom knowledge source. Serval auto-provisions one read-only
// mirror knowledge base for the source and keeps it synced.
message CreateKnowledgeIngestionConfigRequest {
    // The workspace that will own the custom knowledge source.
    string team_id = 1 [(google.api.field_behavior) = REQUIRED];
    // The published knowledge ingestion workflow to sync from.
    string workflow_id = 2 [(google.api.field_behavior) = REQUIRED];
    // Display name for the source / mirror base. Defaults to the workflow's name.
    optional string name = 3;
    // When true, the mirror base is AI-context only: indexed for retrieval but
    // hidden from human-facing surfaces (not browsable, not in the service
    // catalog). Defaults to false.
    optional bool ai_context_only = 4;
}

message CreateKnowledgeIngestionConfigResponse {
    // The created ingestion config's ID.
    string id = 1;
    // The backing knowledge source's ID.
    string knowledge_source_id = 2;
    // Resolved display name of the source (the supplied name, or the workflow's).
    string name = 3;
    // Whether the mirror base was created AI-context only.
    bool ai_context_only = 4;
}

message GetAccessPolicyRequest {
    // The ID of the access policy.
    string id = 1;
}

message GetAccessPolicyResponse {
    // The access policy.
    pubapimodels.AccessPolicy data = 1;
}

message CreateAccessPolicyRequest {
    // The ID of the workspace.
    string team_id = 1 [(google.api.field_behavior) = REQUIRED];
    // The name of the access policy.
    string name = 2 [(google.api.field_behavior) = REQUIRED];
    // A description of the access policy.
    string description = 3;
    // The maximum number of minutes that access can be granted for (optional).
    optional int32 max_access_minutes = 4;
    // Whether a business justification is required when requesting access (optional).
    optional bool require_business_justification = 5;
    // The recommended duration in minutes for access requests (optional).
    optional int32 recommended_access_minutes = 6;
    // Whether requests made on behalf of others require the target user's
    // confirmation (optional).
    optional bool require_on_behalf_of_confirmation = 7;
    // Stable, workspace-scoped identity for the policy (apo_ + 22 base62 chars).
    // Omit to have one minted. Must be unique within the workspace; reserved
    // sentinel values (the workspace-default policy) are rejected.
    optional string scoped_id = 8;
    // The ID of a named approval procedure that must approve requests for
    // roles governed by the policy. Omit it, or send an empty string, to
    // create the policy without approval. Attaching requires permission to
    // view approval procedures.
    optional string approval_procedure_id = 9;
    // Collect access requests with a form rather than a chat conversation.
    optional bool require_form_confirmation = 10;
}

message CreateAccessPolicyResponse {
    // The created access policy.
    pubapimodels.AccessPolicy data = 1;
}

message UpdateAccessPolicyRequest {
    // The ID of the access policy.
    string id = 1;
    // The name of the access policy.
    string name = 2;
    // A description of the access policy.
    string description = 3;
    // The maximum number of minutes that access can be granted for.
    int32 max_access_minutes = 4;
    // Whether a business justification is required when requesting access. Omit to leave unchanged.
    optional bool require_business_justification = 5;
    // The recommended duration in minutes for access requests (optional).
    optional int32 recommended_access_minutes = 6;
    // Whether requests made on behalf of others require the target user's
    // confirmation. Omit to leave unchanged.
    optional bool require_on_behalf_of_confirmation = 7;
    // Rekeys the policy's stable identity (apo_ + 22 base62 chars). Omit to
    // leave unchanged. Must be unique within the workspace. The workspace-default
    // policy cannot be rekeyed, and reserved sentinel values are rejected.
    optional string scoped_id = 8;
    // The ID of a named approval procedure that must approve requests for
    // roles governed by the policy. Omit to leave the policy's approval
    // unchanged; send an empty string to remove it. Attaching requires
    // permission to view approval procedures and removing requires permission
    // to delete them.
    optional string approval_procedure_id = 9;
    // Collect access requests with a form. Omit to leave unchanged.
    optional bool require_form_confirmation = 10;
}

message UpdateAccessPolicyResponse {
    // The updated access policy.
    pubapimodels.AccessPolicy data = 1;
}

message DeleteAccessPolicyRequest {
    // The ID of the access policy.
    string id = 1;
}

message DeleteAccessPolicyResponse {}

message ListAccessPoliciesRequest {
    // The ID of the workspace.
    string team_id = 1;
    // Maximum number of results to return. Default is 10000, maximum is 10000.
    optional int32 page_size = 2;
    // Token for pagination. Leave empty for the first request.
    optional string page_token = 3;
}

message ListAccessPoliciesResponse {
    // The list of access policies.
    repeated pubapimodels.AccessPolicy data = 1;
    // Token for retrieving the next page of results. Empty if no more results.
    optional string next_page_token = 2;
}

// Workflow requests and responses

message GetWorkflowRequest {
    // The ID of the workflow.
    string id = 1;
}

message GetWorkflowResponse {
    // The workflow.
    pubapimodels.Workflow data = 1;
    // Present after a successful binding read, including an empty result.
    // Absent or null means this response does not expose configured bindings.
    ConfiguredWorkflowAppBindings configured_app_bindings = 2;
}

// Saved workflow app-alias bindings, independent of file versions and catalog aliases.
// Includes only non-deleted app instances currently visible to the workflow's workspace;
// an empty result does not rule out hidden bindings or other workflow dependencies.
// Does not establish credentials, connectivity, or runtime access.
message ConfiguredWorkflowAppBindings {
    repeated ConfiguredWorkflowAppBinding bindings = 1;
}

message ConfiguredWorkflowAppBinding {
    string alias = 1;
    string app_instance_id = 2;
}

message CreateWorkflowResponse {
    // The created workflow.
    pubapimodels.Workflow data = 1;
    // Advisory reconciliation of the saved content against the version's
    // package. Always empty when the workspace is not on Integration Access.
    repeated svflow.common.models.IntegrationAccessFinding integration_access_findings = 2;
}

message UpdateWorkflowResponse {
    // The updated workflow.
    pubapimodels.Workflow data = 1;
    // Advisory reconciliation of the saved content against the version's
    // package. Always empty when the workspace is not on Integration Access or
    // when the save carried no new content.
    repeated svflow.common.models.IntegrationAccessFinding integration_access_findings = 2;
}

message DeleteWorkflowRequest {
    // The ID of the workflow.
    string id = 1;
}

message DeleteWorkflowResponse {}

message ListWorkflowsRequest {
    // The ID of the workspace.
    string team_id = 1;
    reserved 2; // was: include_temporary
    // Maximum number of results to return. Default is 1000, maximum is 2000.
    optional int32 page_size = 3;
    // Token for pagination. Leave empty for the first request.
    optional string page_token = 4;
}

message ListWorkflowsResponse {
    // The list of workflows.
    repeated pubapimodels.Workflow data = 1;
    // Token for retrieving the next page of results. Empty if no more results.
    optional string next_page_token = 2;
}

message ResolveScopedRefsRequest {
    // The workspace to resolve the scoped ids within.
    string team_id = 1;
    // The scoped ids to resolve (wf_/skill_/ent_/form_). Ids that do not resolve
    // in the workspace are omitted from the response.
    repeated string scoped_ids = 2;
}

message ResolveScopedRefsResponse {
    // The resolved references, one per scoped id that exists in the workspace.
    repeated ResolvedScopedRef data = 1;
}

message ResolvedScopedRef {
    // The scoped id that was resolved.
    string scoped_id = 1;
    // The resource's global UUID within the workspace.
    string id = 2;
    // The resource's display name.
    string name = 3;
    // The resource kind: "workflow", "guidance", "entitlement", or "form".
    string kind = 4;
}

message ListWorkflowVersionsRequest {
    // The workflow UUID. Not a wf_ scoped id. StartWorkflowRun is the call that accepts either form.
    string workflow_id = 1 [(google.api.field_behavior) = REQUIRED];
    // If true, include unpublished draft versions alongside published ones.
    // Default false (only the complete history of published versions).
    optional bool include_unpublished_drafts = 2;
    // Maximum number of results to return. Default is 1000, maximum is 2000.
    optional int32 page_size = 3;
    // Token for pagination. Leave empty for the first request.
    optional string page_token = 4;
}

message ListWorkflowVersionsResponse {
    // The list of workflow versions, newest first.
    repeated pubapimodels.WorkflowVersion data = 1;
    // Token for retrieving the next page of results. Empty if no more results.
    optional string next_page_token = 2;
