// Search Workflow Runs requests and responses

message SearchWorkflowRunsRequest {
    // The ID of the workspace. Required.
    string team_id = 1;
    // The workflow UUID. Not a wf_ scoped id.
    optional string workflow_id = 2;
    // Filter by statuses (multiple allowed).
    repeated svflow.common.models.WorkflowRunStatus statuses = 3;
    // Filter by the target user for the workflow run.
    optional string target_user_id = 4;
    // Filter by the user who initiated the workflow run.
    optional string initiated_by_user_id = 5;
    // Filter by runs created after this timestamp (RFC3339 format).
    optional string created_after = 6;
    // Filter by runs created before this timestamp (RFC3339 format).
    optional string created_before = 7;
    // Filter by linked ticket ID.
    optional string linked_ticket_id = 8;
    // Maximum number of results to return. Default is 50, maximum is 200.
    // Larger values are silently coerced server-side; the actual value used
    // is returned in the X-Served-Page-Size response header.
    optional int32 page_size = 9;
    // Token for pagination. Leave empty for the first request.
    optional string page_token = 10;
    // When true (default), each returned run includes its `output` field
    // (the full workflow result). For multi-row search responses this can be
    // megabytes per row — set to false if you only need run metadata; you
    // can then fetch full output per-run via GetWorkflowRun. Strongly
    // recommended `false` for any caller that does not need `output`.
    optional bool include_output = 11;
    // Filter to the direct child runs (sub-workflows) of this parent run.
    // Pass a run ID here to list the runs it spawned one level deep; combine
    // with `statuses` (e.g. FAILED) to find the failing children.
    optional string parent_workflow_run_id = 12;
    // Whether to include child runs (sub-workflows) in the results. Unset
    // means true (all runs are returned — matches include_output's
    // unset-means-true convention). Set explicitly to false to return only
    // top-level runs; on journey-heavy workspaces child runs can be >90% of total
    // rows, so this avoids paging them just to discard them client-side.
    // include_child_runs=false is mutually exclusive with
    // parent_workflow_run_id (a run cannot both have a given parent and no
    // parent); combining them is a 400.
    optional bool include_child_runs = 13;
    // When true, return only runs that are linked to a ticket
    // (linked_ticket_id set). Unset and explicit false are equivalent — no
    // filter is applied. Useful for building per-ticket run indexes without
    // fetching unlinked runs.
    optional bool include_runs_with_linked_ticket = 14;
}

message SearchWorkflowRunsResponse {
    // The list of workflow runs.
    repeated pubapimodels.WorkflowRun data = 1;
    // Token for retrieving the next page of results. Empty if no more results.
    optional string next_page_token = 2;
}

// Same filter set as SearchWorkflowRunsRequest, minus pagination and
// include_output — the two requests must stay filter-compatible so a caller
// can count a result set and then page exactly that set.
message CountWorkflowRunsRequest {
    // The ID of the workspace. Required.
    string team_id = 1;
    // The workflow UUID. Not a wf_ scoped id.
    optional string workflow_id = 2;
    // Filter by statuses (multiple allowed).
    repeated svflow.common.models.WorkflowRunStatus statuses = 3;
    // Filter by the target user for the workflow run.
    optional string target_user_id = 4;
    // Filter by the user who initiated the workflow run.
    optional string initiated_by_user_id = 5;
    // Filter by runs created after this timestamp (RFC3339 format).
    optional string created_after = 6;
    // Filter by runs created before this timestamp (RFC3339 format).
    optional string created_before = 7;
    // Filter by linked ticket ID.
    optional string linked_ticket_id = 8;
    // Count only the direct child runs (sub-workflows) of this parent run.
    optional string parent_workflow_run_id = 9;
    // Whether to include child runs (sub-workflows) in the count. Unset
    // means true (matches include_output's unset-means-true convention). Set
    // explicitly to false to count only top-level runs.
    // include_child_runs=false is mutually exclusive with
    // parent_workflow_run_id; combining them is a 400.
    optional bool include_child_runs = 10;
    // When true, count only runs that are linked to a ticket
    // (linked_ticket_id set). Unset and explicit false are equivalent — no
    // filter is applied.
    optional bool include_runs_with_linked_ticket = 11;
}

message CountWorkflowRunsResponse {
    // The number of workflow runs matching the filters.
    int64 count = 1;
}

