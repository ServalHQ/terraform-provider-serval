syntax = "proto3";

package svflow.pubapimodels;

import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "serval/resources/v1/agentchannels/channels.proto";
import "svflow/common/models.proto";
import "svflow/pubapimodels/changesets.proto";

/////////////////////////////////////////////////////////
// Public API / SDK models for access management

message AccessPolicy {
    // The ID of the access policy.
    string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The ID of the workspace that the access policy belongs to.
    string team_id = 7;
    // The name of the access policy.
    string name = 2;
    // A description of the access policy.
    optional string description = 3;
    // The maximum number of minutes that access can be granted for.
    optional int32 max_access_minutes = 4;
    // Whether a business justification is required when requesting access.
    optional bool require_business_justification = 5;
    // The recommended duration in minutes for access requests (optional).
    optional int32 recommended_access_minutes = 6;
    // Whether requests made on behalf of others require the target user's
    // confirmation.
    optional bool require_on_behalf_of_confirmation = 8;
    // Stable, workspace-scoped identity of the policy (apo_ + 22 chars).
    // Minted at create when not supplied; preserved verbatim when the policy
    // is copied to another workspace, so cross-workspace tooling can match copies to
    // their origin. Settable on create and rekeyable via update, except for
    // the workspace-default policy, whose sentinel scoped id is server-managed.
    string scoped_id = 9;
    // The ID of the named approval procedure that must approve requests for
    // roles governed by the policy. Unset when the policy has no named
    // approval procedure, including when it uses a per-policy approval
    // procedure from ListAccessPolicyApprovalProcedures. Omitted from
    // ListRequestableRoles responses.
    optional string approval_procedure_id = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
    // Whether access requests are collected with a form rather than chat.
    optional bool require_form_confirmation = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ApprovalStep {
    // The ID of the approval step.
    string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
    // Whether the step can be approved by the requester themselves.
    // optional so server can distinguish "not set" from "explicitly false"
    // (DB defaults to TRUE; proto3 defaults bool to false)
    optional bool allow_self_approval = 2;

    // Exactly one of approvers or custom_workflow must be set.
    // Mutual exclusivity validated server-side.
    repeated Approver approvers = 3;
    optional CustomWorkflowConfig custom_workflow = 4;
    // Controls whether approvers are asked for a justification when deciding this step.
    // Valid values: "not_requested", "optional", "required",
    // "required_for_approval", "required_for_denial". Empty defaults to
    // "not_requested". The "_for_approval" and "_for_denial" variants make the
    // justification mandatory only when approving or denying, respectively.
    string approver_justification_mode = 5;
    // Whether notifications are suppressed while the step remains actionable.
    bool suppress_notifications = 6;
    // Whether an approver whose approval would otherwise be assumed (they are
    // the request's target, or its ticket's creator) has it resolved for them
    // on render. Set false with allow_self_approval true to show someone their
    // own approval as a card they must click. Optional for the same reason as
    // allow_self_approval: the DB default is TRUE.
    optional bool auto_approve_self = 7;
}

message AccessPolicyApprovalProcedure {
    // The ID of the access policy approval procedure.
    string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The ID of the access policy this approval procedure belongs to.
    string access_policy_id = 3;
    // The steps in the approval procedure.
    repeated ApprovalStep steps = 2;
    // How long each step waits for a human decision before timing out
    // (in seconds).
    int32 timeout_seconds = 4;
    // Stages are authoritative when present; steps remains a flattened
    // compatibility projection.
    repeated AccessPolicyApprovalStage stages = 5;
}

message AccessPolicyApprovalStage {
    repeated ApprovalStep steps = 1;
}

message WorkflowApprovalProcedure {
    // The ID of the workflow approval procedure.
    string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The ID of the workflow this approval procedure belongs to.
    string workflow_id = 3;
    // The steps in the approval procedure.
    repeated ApprovalStep steps = 2;
    // Stages are authoritative when present; steps remains a flattened
    // compatibility projection.
    repeated WorkflowApprovalStage stages = 4;
}

message WorkflowApprovalStage {
    repeated ApprovalStep steps = 1;
}

// A first-class, workspace-scoped approval procedure: a library resource with no
// parent workflow or access policy. Name, description, timeout and steps are
// versioned together: any change creates a new immutable version.
message ApprovalProcedure {
    // The ID of the approval procedure.
    string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
    // Stable, workspace-scoped identity of the procedure (aproc_ + 22 chars).
    // Minted at create when not supplied.
    string scoped_id = 2;
    // The ID of the workspace that owns the approval procedure.
    string team_id = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The display name of the approval procedure. Not unique; scoped_id is
    // the identity. Changing it creates a new version.
    string name = 4;
    // A description of the approval procedure.
    string description = 5;
    // How long each step waits for a human decision before timing out
    // (in seconds).
    int32 timeout_seconds = 6;
    // When the current version was created.
    google.protobuf.Timestamp updated_at = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The steps of the procedure, in order.
    repeated ApprovalProcedureStep steps = 8;
}

// A workflow or access policy an approval procedure is attached to.
message ApprovalProcedureConsumer {
    // "workflow" or "access_policy".
    string type = 1;
    // The ID of the workflow or access policy.
    string id = 2;
}

// What still points at a legacy approval.
enum LegacyApprovalConsumerKind {
    LEGACY_APPROVAL_CONSUMER_KIND_UNSPECIFIED = 0;
    LEGACY_APPROVAL_CONSUMER_KIND_WORKFLOW = 1;
    LEGACY_APPROVAL_CONSUMER_KIND_ACCESS_POLICY = 2;
    // The workspace's Catalyst change review setting.
    LEGACY_APPROVAL_CONSUMER_KIND_CATALYST_REVIEW = 3;
    // The workspace's config push review setting.
    LEGACY_APPROVAL_CONSUMER_KIND_CONFIG_PUSH_REVIEW = 4;
}

// Why the migration could not convert a legacy approval.
enum LegacyApprovalMigrationFailureReason {
    LEGACY_APPROVAL_MIGRATION_FAILURE_REASON_UNSPECIFIED = 0;
    // The legacy approval has no steps, so it approves nothing.
    LEGACY_APPROVAL_MIGRATION_FAILURE_REASON_NO_STEPS = 1;
    // Some steps run in stages and others do not.
    LEGACY_APPROVAL_MIGRATION_FAILURE_REASON_MIXED_STAGES = 2;
    // The legacy definition breaks a rule named procedures enforce.
    LEGACY_APPROVAL_MIGRATION_FAILURE_REASON_INVALID_DEFINITION = 3;
    // The legacy definition has no named-procedure equivalent, such as two
    // steps in parallel where a step has more or fewer than one approver.
    LEGACY_APPROVAL_MIGRATION_FAILURE_REASON_UNREADABLE_DEFINITION = 4;
    // The consumer refused the converted procedure.
    LEGACY_APPROVAL_MIGRATION_FAILURE_REASON_ATTACH_REFUSED = 5;
    // The consumer's approval changed while the migration ran.
    LEGACY_APPROVAL_MIGRATION_FAILURE_REASON_CHANGED_DURING_MIGRATION = 6;
    // The legacy procedure is deleted or belongs to another workspace. The gate
    // may still be enforced; read legacy_definition before changing it.
    LEGACY_APPROVAL_MIGRATION_FAILURE_REASON_LEGACY_PROCEDURE_MISSING = 7;
    LEGACY_APPROVAL_MIGRATION_FAILURE_REASON_INTERNAL = 8;
}

// Whether the consumer's current legacy approval definition could be read.
enum LegacyApprovalDefinitionStatus {
    LEGACY_APPROVAL_DEFINITION_STATUS_UNSPECIFIED = 0;
    // legacy_definition holds the definition the consumer points at.
    LEGACY_APPROVAL_DEFINITION_STATUS_AVAILABLE = 1;
    // The legacy procedure row is deleted or does not exist.
    LEGACY_APPROVAL_DEFINITION_STATUS_MISSING = 2;
    // The legacy procedure belongs to a workspace that could not be confirmed to
    // be in this organization, so its definition is withheld.
    LEGACY_APPROVAL_DEFINITION_STATUS_WITHHELD_OUTSIDE_ORGANIZATION = 3;
}

// A legacy approval definition. Stages run in order; every step in a stage
// must approve, and within a step one approval is enough.
message LegacyApprovalDefinition {
    // The workspace that owns the legacy procedure. Differs from the consumer's
    // workspace when the consumer was copied from another workspace.
    string team_id = 1;
    // How long each step waits for a decision before timing out (in seconds).
    int32 timeout_seconds = 2;
    // The steps in stored order.
    repeated ApprovalStep steps = 3;
    // The steps grouped by the stage they run in. Empty when steps mix
    // staged and unstaged steps.
    repeated LegacyApprovalStage stages = 4;
}

message LegacyApprovalStage {
    repeated ApprovalStep steps = 1;
}

// A workflow, access policy or review setting the legacy approval migration
// could not convert. It keeps its legacy approval until it is resolved.
message LegacyApprovalMigrationFailure {
    LegacyApprovalConsumerKind consumer_kind = 1;
    // The workflow or access policy ID, or the workspace ID for a review setting.
    string consumer_id = 2;
    string consumer_name = 3;
    LegacyApprovalMigrationFailureReason reason = 4;
    // What the migration reported, for diagnosis.
    string detail = 5;
    google.protobuf.Timestamp failed_at = 6;
    // The legacy procedure the consumer points at.
    string legacy_approval_procedure_id = 7;
    LegacyApprovalDefinitionStatus legacy_definition_status = 8;
    // Set only when legacy_definition_status is AVAILABLE.
    LegacyApprovalDefinition legacy_definition = 9;
}

message AppInstance {
    // The ID of the app instance.
    string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The ID of the Serval workspace that owns the app instance. For instances
    // returned by ListAppInstances because they are shared with the requesting
    // workspace, this is the owning workspace's ID and will differ from the request
    // team_id.
    string team_id = 2;
    
    // Either a built-in service or a custom service. Exactly one must be set.
    oneof service_type {
        // The service identifier (for built-in services like "github", "okta", "aws").
        string service = 3;
        // The ID of the custom service (for custom apps).
        string custom_service_id = 8;
    }
    
    // The external service instance ID (e.g., GitHub org name, Okta domain, AWS account ID).
    string external_service_instance_id = 4;
    // The name of the app instance.
    string name = 5;
    // Whether access requests are enabled for the app instance.
    bool access_requests_enabled = 6;
    // The default access policy for the app instance.
    optional string default_access_policy_id = 7;
    // The display name of the custom service (only set when service_type is custom_service_id).
    string custom_service_name = 9;
    // IDs of the tags currently attached to this app instance.
    repeated string tag_ids = 10;
    // IDs of the integrations configured for this app instance.
    repeated string integration_ids = 11;
    // The A2A agent card captured by the last discovery sync. Set only for
    // custom apps connected as A2A agents whose card has been discovered —
    // it describes the external agent's identity and advertised skills.
    svflow.common.models.A2AAgentCard a2a_agent_card = 12;
    // When true, workflows that use this app run on the self-hosted (hybrid)
    // worker of the workspace running the workflow, and the app's requests egress
    // from that worker inside the customer's network instead of Serval's
    // cloud proxy. Set for apps that are only reachable on a private network.
    bool route_direct_from_worker = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
    AppInstanceOwners owners = 14;
}

// DEPRECATED: app instance labels are unified into the polymorphic Tag model.
// Retained so the deprecated /v2/app-instance-labels endpoints keep their
// original response shape. New integrations should use Tag.
message AppInstanceLabel {
    option deprecated = true;
    // The ID of the label.
    string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The ID of the workspace that owns the label.
    string team_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The name of the label.
    string name = 3;
    // Optional description of the label.
    string description = 4;
}

// DEPRECATED: superseded by AccessRelationship. Retained so the deprecated
// /v2/app-relationships endpoints keep their original response shape.
message AppRelationship {
    option deprecated = true;
    // The ID of the app relationship.
    string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The ID of the app instance.
    string app_instance_id = 2;
    // The type of the relationship.
    svflow.common.models.AppRelationshipType relationship_type = 3;
    // The ID of the target (user or group).
    string target_id = 4;
    // The type of the target.
    svflow.common.models.AppRelationshipTargetType target_type = 5;
    // The timestamp when the relationship was created.
    google.protobuf.Timestamp created_at = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message AccessRelationship {
    // The ID of the access relationship.
    string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The type of the relationship.
    svflow.common.models.AccessRelationshipType relationship_type = 2;
    // The ID of the target (user or group).
    string target_id = 3;
    // The type of the target.
    svflow.common.models.AccessRelationshipTargetType target_type = 4;
    // The timestamp when the relationship was created.
    google.protobuf.Timestamp created_at = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The kind of subject this relationship is on.
    svflow.common.models.AccessRelationshipSubjectType subject_type = 6;
    // The ID of the subject (app_instance_id | resource_id | entitlement_id |
    // team_id), disambiguated by subject_type.
    string subject_id = 7;
}

// An owner (user or group) to set on an access-hierarchy subject.
message OwnerTarget {
    // The ID of the owner (user or group).
    string target_id = 1;
    // The type of the owner.
    svflow.common.models.AccessRelationshipTargetType target_type = 2;
}

// The complete owner set for a subject, replaced wholesale. Wrapping the list
// in a message lets update requests distinguish "owners unchanged" (absent)
// from "remove all owners" (present with an empty list).
message OwnerTargetSet {
    repeated OwnerTarget owners = 1;
}

message Resource {
    // The ID of the resource.
    string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The ID of the app instance that the resource belongs to.
    string app_instance_id = 2;
    // The type of the resource.
    string resource_type = 3;
    // The name of the resource.
    string name = 4;
    // A description of the resource.
    optional string description = 5;
    // The external ID of the resource.
    optional string external_id = 6;
    // IDs of the tags currently attached to this resource.
    repeated string tag_ids = 7;
    // The copy-invariant scoped ID of the resource (e.g. "ar_..."), stable
    // across cross-workspace copies. Server-derived from the resource's external
    // identity for ingested resources and the built-in access resource;
    // settable on create and rekeyable via update only for custom resources.
    // Empty for resources created before scoped ids existed, until backfilled.
    string scoped_id = 8;
}

message Entitlement {
    // The ID of the entitlement.
    string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The ID of the resource that the entitlement belongs to.
    string resource_id = 2;
    // The name of the entitlement.
    string name = 3;
    // A description of the entitlement.
    string description = 4;
    reserved 5; // was: provisioning_method (deprecated)
    // Whether requests are enabled for the entitlement.
    bool requests_enabled = 6;
    // The default access policy for the entitlement.
    optional string access_policy_id = 7;
    reserved 8; // was: linked_entitlement_ids (deprecated)
    reserved 9; // was: manual_provisioning_assignees (deprecated)

    // Provisioning configuration. **Exactly one method should be set.**
    ProvisioningMethod provisioning_method = 10;

    // The external ID of the entitlement in the external system (optional).
    optional string external_id = 11;
    // Data from the external system as a JSON string (computed by server).
    optional string external_data = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The copy-invariant scoped ID of the entitlement (e.g. "ent_..."), stable across cross-workspace copies.
    string scoped_id = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Role represents a requestable role on an app resource.
message Role {
    // The ID of the role.
    string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The ID of the resource that the role belongs to.
    string resource_id = 2;
    // The name of the role.
    string name = 3;
    // A description of the role.
    string description = 4;
    // Whether requests are enabled for the role.
    bool requests_enabled = 5;
    // The default access policy for the role.
    optional string access_policy_id = 6;
    // Provisioning configuration. **Exactly one method should be set.**
    RoleProvisioningMethod provisioning_method = 7;
    // The external ID of the role in the external system (optional).
    optional string external_id = 8;
    // Data from the external system as a JSON string (computed by server).
    optional string external_data = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
    bool require_form_confirmation = 10;
    // IDs of the tags currently attached to this role.
    repeated string tag_ids = 11;
    // Whether the role was ingested from an external system. Ingested roles'
    // name, description, external_id, and external_data are owned by that
    // system and cannot be edited here.
    bool is_ingested = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The immutable scoped ID of the role (e.g. "role_..."), retained across
    // copies and editable-role renames. Ingested roles and fixed connector
    // defaults have deterministic IDs and protected names. Other roles get
    // random IDs unless an ID is supplied on create. Existing IDs remain
    // unchanged during updates.
    string scoped_id = 13;
}

message TeamAccessRequestSettings {
    string team_id = 1;
    bool default_require_form_confirmation = 2;
}

// Provisioning configuration for a role.
// Exactly one method should be set.
message RoleProvisioningMethod {
    oneof method {
        BuiltinWorkflowProvisioning builtin_workflow = 1;
        CustomWorkflowProvisioning custom_workflow = 2;
        ManualProvisioning manual = 3;
        LinkedRolesProvisioning linked_roles = 4;
    }
}

// Provisioning depends on prerequisite roles being provisioned first.
message LinkedRolesProvisioning {
    repeated string linked_role_ids = 1;
    // Locally managed Serval groups whose membership is manageable by the role's owning workspace.
    // Omission preserves existing group links; a present empty wrapper clears them.
    LinkedServalGroups linked_serval_groups = 2;
}

message LinkedServalGroups {
    repeated string ids = 1;
}

// Provisioning configuration for an entitlement.
// Exactly one method should be set.
message ProvisioningMethod {
    oneof method {
        BuiltinWorkflowProvisioning builtin_workflow = 1;
        CustomWorkflowProvisioning custom_workflow = 2;
        ManualProvisioning manual = 3;
        LinkedEntitlementsProvisioning linked_entitlements = 4;
    }
}

// Provisioning is handled by the service's builtin workflow integration.
message BuiltinWorkflowProvisioning {}

// Provisioning is handled by custom workflows for provision + deprovision.
message CustomWorkflowProvisioning {
    // The workflow ID to provision access.
    string provision_workflow_id = 1;
    // The workflow ID to deprovision access.
    string deprovision_workflow_id = 2;
}

// Provisioning is handled manually by assigned users/groups.
message ManualProvisioning {
    // Omit routing to leave the role unconfigured, as reported by
    // entitlement_is_misconfigured. Named assignees must be nonempty.
    oneof routing {
        NamedAssignees named_assignees = 1;
        TeamQueue team_queue = 2;
    }
}

message NamedAssignees {
    // Users and groups assigned/notified for manual provisioning. Must name at
    // least one; to leave the task unassigned, use team_queue instead.
    repeated ManualProvisioningAssignee assignees = 1;
}

// The provisioning task is created unassigned so the workspace's ticket assignment
// rules route it. A message rather than a bool so it can carry fields later
// without adding a routing variant.
message TeamQueue {}

// Provisioning depends on prerequisite entitlements being provisioned first.
message LinkedEntitlementsProvisioning {
    // The IDs of prerequisite entitlements.
    repeated string linked_entitlement_ids = 1;
}

enum ManualProvisioningAssigneeType {
    MANUAL_PROVISIONING_ASSIGNEE_TYPE_UNSPECIFIED = 0;
    MANUAL_PROVISIONING_ASSIGNEE_TYPE_USER = 1;
    MANUAL_PROVISIONING_ASSIGNEE_TYPE_GROUP = 2;
}

message ManualProvisioningAssignee {
    // The ID of the user or group.
    string assignee_id = 1;
    // The type of assignee.
    ManualProvisioningAssigneeType assignee_type = 2;
}

// A tag that can be associated with workflows.
message Tag {
    // The ID of the tag.
    string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The name of the tag.
    string name = 2;
    // The color of the tag (CSS color string).
    optional string color = 3;
    // The icon slug for the tag.
    optional string icon_slug = 4;
    // The ID of the workspace that owns this tag.
    string team_id = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
    // A description of the tag.
    string description = 6;
}

message Workflow {
    // The ID of the workflow.
    string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The ID of the workspace that the workflow belongs to.
    string team_id = 2;
    // The name of the workflow.
    string name = 3;
    // A description of the workflow.
    string description = 4;
    reserved 5; // was: type
    reserved 6; // was: execution_scope
    // Whether the workflow requires form confirmation.
    bool require_form_confirmation = 7;
    reserved 8; // was: is_temporary
    // The content/code of the workflow.
    string content = 9;
    reserved 10; // was: parameters
    // Whether the workflow is published. Set to true to publish the workflow.
    bool is_published = 11;
    // Whether there are unpublished changes to the workflow (computed by server).
    bool has_unpublished_changes = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
    // IDs of tags associated with this workflow.
    repeated string tag_ids = 13;
    // Whether this workflow is listed in the Service Catalog.
    bool show_in_service_catalog = 14;
    // Description shown at the top of the Service Catalog run form.
    string service_catalog_description = 15;
    // The copy-invariant scoped ID of the workflow (e.g. "wf_..."), stable across cross-workspace copies.
    string scoped_id = 16 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The ID of the folder the workflow lives in, if any. Populated on the
    // single-workflow responses (Get/Create/Update and the folder-move
    // endpoint); omitted from ListWorkflows responses — fetch the workflow to
    // read its folder membership.
    optional string folder_id = 17 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The ID of the named approval procedure that must approve each run of the
    // workflow; change it with UpdateWorkflow. Unset when the workflow has no
    // named approval procedure, including when it uses a per-workflow approval
    // procedure from ListWorkflowApprovalProcedures. Populated on the
    // single-workflow responses (Get/Create/Update); omitted from ListWorkflows
    // responses.
    optional string approval_procedure_id = 18 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The access package, by name, whose connections the workflow's runs use:
    // the published version's package, or the only version's when never
    // published. Empty for the workspace's default package. A move made with
    // UpdateWorkflow shows here once it is published. Populated on the
    // single-workflow responses (Get/Create/Update); omitted from ListWorkflows
    // responses and when the workspace is off Integration Access.
    optional string package = 19 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message WorkflowVersion {
    // The ID of this workflow version. Pass to StartWorkflowRun as
    // workflow_version_id to run this specific version (works for both
    // published versions and unpublished drafts).
    string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The ID of the workflow this version belongs to.
    string workflow_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
    // Workflow name at this version (can differ across versions).
    string name = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
    // Workflow description at this version.
    string description = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The TypeScript content of the workflow at this version.
    string content = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
    // User who created this version.
    string created_by_user_id = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
    // When this version was first saved (always set).
    google.protobuf.Timestamp created_at = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
    // When this version was published. Unset for draft (unpublished) versions.
    optional google.protobuf.Timestamp published_at = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
    // Whether this version has ever been published.
    bool is_published = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message Guidance {
    // The ID of the guidance.
    string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The ID of the workspace that the guidance belongs to.
    string team_id = 2;
    // The name of the guidance.
    string name = 3;
    // A description of the guidance.
    string description = 4;
    // The content of the guidance.
    string content = 5;
    // Whether this guidance should always be used (skipping LLM selection).
    bool should_always_use = 6;
    // Whether the guidance is published. Set to true to publish the guidance.
    bool is_published = 7;
    // Whether there are unpublished changes to the guidance (computed by server).
    bool has_unpublished_changes = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The copy-invariant scoped ID of the guidance (e.g. "skill_..."), stable across cross-workspace copies.
    string scoped_id = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The ID of the folder the guidance lives in, if any. Populated on the
    // single-guidance responses (Get/Create/Update and the folder-move
    // endpoint); omitted from ListGuidances responses — fetch the guidance to
    // read its folder membership.
    optional string folder_id = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
    serval.resources.v1.agentchannels.AgentChannelFilter channel_filter = 11;
}

// A help desk skill: instructions the help desk agent follows when a ticket
// matches the skill's description.
message Skill {
    // The ID of the skill.
    string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The ID of the workspace that the skill belongs to.
    string team_id = 2;
    // The name of the skill.
    string name = 3;
    // When the help desk agent should use the skill.
    string description = 4;
    // How the help desk agent should handle a ticket when it uses the skill.
    string content = 5;
    // Whether the help desk agent always uses this skill instead of selecting
    // it by its description.
    bool should_always_use = 6;
    // Whether the skill has ever been published.
    bool is_published = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
    // Whether the skill has saved changes that are not yet published.
    bool has_unpublished_changes = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The copy-invariant scoped ID of the skill (e.g. "skill_..."), stable
    // across cross-workspace copies.
    string scoped_id = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The ID of the folder the skill lives in, if any. Populated on the
    // single-skill responses (Get/Create/Update); omitted from ListSkills
    // responses — fetch the skill to read its folder membership.
    optional string folder_id = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The channels where the help desk agent can use the skill. Empty means
    // every channel, including channels added later.
    serval.resources.v1.agentchannels.AgentChannelFilter channel_filter = 11;
}

message FolderItem {
    FolderItemType item_type = 1;
    string item_id = 2;
}

message FolderItemLocation {
    FolderItem item = 1;
    // Unset when the item is at the root.
    optional string folder_id = 2;
}

// A folder organizing a specific type of item within a workspace.
message Folder {
    // The ID of the folder.
    string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The ID of the workspace that the folder belongs to.
    string team_id = 2;
    // The name of the folder.
    string name = 3;
    // The non-folder item type this folder can contain.
    FolderItemType item_type = 4;
    // The ID of the parent folder. Unset when the folder is at the root of the
